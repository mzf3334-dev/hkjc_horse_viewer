<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HKJC 賽馬分析 | 下場預測工具</title>
  <style>
    :root {
      --blue:      #003F88;
      --blue-lt:   #0055B3;
      --bg:        #F0F2F5;
      --white:     #FFFFFF;
      --border:    #E0E0E0;
      --t1:        #111111;
      --t2:        #555555;
      --t3:        #888888;
      --gold:      #C8960C;
      --silver:    #9CA3AF;
      --bronze:    #A0522D;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Noto Sans TC', BlinkMacSystemFont,
                   'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--t1);
    }

    /* ── Header ── */
    .hdr {
      background: var(--blue);
      color: #fff;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky; top: 0; z-index: 200;
      box-shadow: 0 2px 8px rgba(0,0,0,.35);
    }
    .hdr-icon  { font-size: 26px; }
    .hdr-title { font-size: 17px; font-weight: 700; letter-spacing: .4px; }
    .hdr-sub   { font-size: 11px; opacity: .7; margin-top: 1px; }
    .hdr-race-day {
      margin-left: 12px; font-size: 12px;
      background: rgba(255,255,255,.18);
      padding: 3px 10px; border-radius: 12px;
    }

    /* ── Loading overlay ── */
    .loading-overlay {
      position: fixed; inset: 0;
      background: rgba(255,255,255,.85);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; z-index: 999;
    }
    .loading-overlay.hidden { display: none; }
    .hidden { display: none !important; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #E5E7EB;
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-txt { font-size: 14px; color: var(--t2); }

    /* ── Error / no-race state ── */
    .fullstate {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: calc(100vh - 50px);
      gap: 10px; color: var(--t3); text-align: center; padding: 20px;
    }
    .fullstate .fi  { font-size: 48px; }
    .fullstate .ft  { font-size: 16px; font-weight: 600; color: var(--t2); }
    .fullstate .fs  { font-size: 13px; }
    .fullstate .retry-btn {
      margin-top: 8px;
      padding: 8px 20px;
      background: var(--blue); color: #fff;
      border: none; border-radius: 6px;
      font-size: 13px; cursor: pointer;
    }
    .fullstate .retry-btn:hover { background: var(--blue-lt); }

    /* ── Layout ── */
    .layout {
      display: flex;
      height: calc(100vh - 50px);
    }

    /* ── Race list panel ── */
    .race-panel {
      width: 300px; min-width: 260px;
      background: var(--white);
      overflow-y: auto;
      border-right: 2px solid var(--border);
      flex-shrink: 0;
    }
    .panel-hdr {
      padding: 10px 14px;
      background: #F8F8F8;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .panel-hdr-title {
      font-size: 12px; font-weight: 600;
      color: var(--blue); text-transform: uppercase;
      letter-spacing: .5px; margin-bottom: 4px;
    }
    .panel-hdr-date {
      font-size: 14px; font-weight: 700; color: var(--t1);
      margin-bottom: 4px;
    }
    .panel-hdr-badge {
      display: inline-block;
      background: #E8F5E9; color: #1B5E20;
      font-size: 11px; font-weight: 700;
      padding: 2px 7px; border-radius: 10px;
    }

    /* Race item */
    .race-item {
      display: flex; align-items: flex-start;
      padding: 13px 14px;
      border-bottom: 1px solid #F0F0F0;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background .12s;
    }
    .race-item:hover  { background: #F0F4FF; }
    .race-item.active { background: #E8EFFF; border-left-color: var(--blue); }
    .race-num {
      width: 42px; height: 42px;
      background: #E5E7EB; color: #444;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; font-weight: 700;
      flex-shrink: 0; margin-right: 12px; margin-top: 2px;
      transition: background .12s, color .12s;
    }
    .race-item.active .race-num { background: var(--blue); color: #fff; }
    .race-info { flex: 1; min-width: 0; }
    .race-meta { font-size: 11px; color: var(--t3); margin-bottom: 2px; }
    .race-dist { font-size: 21px; font-weight: 700; line-height: 1.2; }
    .race-going { font-size: 12px; color: var(--t2); margin-top: 3px; }
    .race-chevron { align-self: center; color: #CCC; font-size: 16px; margin-left: 6px; }

    /* ── Detail panel ── */
    .detail-panel {
      flex: 1; overflow-y: auto;
      background: var(--bg); min-width: 0;
    }
    .empty-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 55%; gap: 8px;
      color: #BBB; text-align: center;
    }
    .empty-state .ei   { font-size: 48px; }
    .empty-state .etxt { font-size: 16px; }
    .empty-state .esub { font-size: 12px; color: #CCC; }

    /* Race detail header */
    .detail-hdr {
      background: var(--white);
      padding: 13px 16px;
      border-bottom: 2px solid var(--blue);
      position: sticky; top: 0; z-index: 10;
    }
    .detail-label { font-size: 11px; color: var(--t3); margin-bottom: 2px; }
    .detail-title {
      font-size: 17px; font-weight: 700; color: var(--blue);
      margin-bottom: 4px;
    }
    .detail-meta { font-size: 13px; color: var(--t2); }

    /* Card legend row */
    .card-legend {
      display: flex; align-items: flex-start;
      padding: 5px 16px 7px;
      background: #FAFAFA; border-bottom: 1px solid var(--border);
    }
    .cl-left  { flex: 1; font-size: 10px; font-weight: 700; color: var(--t3);
                text-transform: uppercase; letter-spacing: .4px; padding-top: 4px; }
    .cl-right { display: flex; flex-direction: column; gap: 3px;
                min-width: 155px; align-items: flex-end; }
    .cl-right span { font-size: 9px; color: var(--t3); font-weight: 600; letter-spacing: .3px; }

    /* ── Horse card ── */
    .horse-card {
      display: flex; align-items: center;
      background: var(--white);
      margin: 5px 8px;
      border-radius: 8px;
      padding: 11px 14px;
      box-shadow: 0 1px 3px rgba(0,0,0,.07);
      border-left: 4px solid #E5E7EB;
      transition: box-shadow .12s;
    }
    .horse-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,.12); }

    .horse-num {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 15px; font-weight: 700; color: var(--t2);
      width: 44px; flex-shrink: 0; margin-right: 10px;
    }
    .silk-wrap {
      width: 38px; height: 38px; overflow: hidden;
      border-radius: 4px; border: 1px solid #E0E0E0;
      background: #F8F8F8;
      display: flex; align-items: center; justify-content: center;
    }
    .silk-img  { width: 38px; height: auto; display: block; }
    .horse-gw {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 52px; flex-shrink: 0; margin: 0 10px; gap: 3px;
    }
    .hg-num    { font-size: 22px; font-weight: 800; color: var(--blue); line-height: 1; }
    .hg-weight { font-size: 11px; font-weight: 600; color: var(--t3); white-space: nowrap; }
    .horse-rec {
      display: flex; align-items: center; justify-content: center;
      width: 60px; flex-shrink: 0; margin: 0 8px;
    }
    .cl-rec {
      font-size: 10px; font-weight: 700; color: var(--t3);
      text-transform: uppercase; letter-spacing: .4px;
      width: 60px; margin: 0 8px; flex-shrink: 0;
      text-align: center; padding-top: 4px;
    }
    .horse-trj {
      display: flex; align-items: center; justify-content: center;
      width: 64px; flex-shrink: 0; margin: 0 8px;
    }
    .cl-trj {
      font-size: 10px; font-weight: 700; color: var(--t3);
      text-transform: uppercase; letter-spacing: .4px;
      width: 64px; margin: 0 8px; flex-shrink: 0;
      text-align: center; padding-top: 4px;
    }
    .cl-gw {
      font-size: 10px; font-weight: 700; color: var(--t3);
      text-transform: uppercase; letter-spacing: .4px;
      width: 52px; margin: 0 10px; flex-shrink: 0;
      text-align: center; padding-top: 4px;
    }
    .horse-left  { flex: 1; min-width: 0; }
    .h-name {
      font-size: 19px; font-weight: 700; color: var(--t1);
      margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .h-jockey  { font-size: 13px; color: var(--t2); margin-bottom: 2px; }
    .h-trainer { font-size: 12px; color: var(--t3); }
    .h-label   { font-size: 11px; color: var(--t3); margin-right: 4px; }

    .horse-right {
      display: flex; flex-direction: column;
      align-items: flex-end; gap: 5px;
      margin-left: 12px; flex-shrink: 0; min-width: 110px;
    }
    .hr-row2 { display: flex; justify-content: flex-end; }
    .hr-row3 { display: flex; justify-content: flex-end; }
    .form-chips { display: inline-flex; gap: 3px; align-items: center; flex-wrap: nowrap; }
    .fchip {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 22px; height: 22px; padding: 0 4px;
      border-radius: 11px; font-size: 11px; font-weight: 700;
    }
    .fc-1    { background: var(--gold);   color: #fff; }
    .fc-top  { background: var(--silver); color: #fff; }
    .fc-mid  { background: #D1FAE5; color: #065F46; }
    .fc-tail { background: #F3F4F6; color: #6B7280; }
    .fc-pu   { background: #FEE2E2; color: #991B1B; }
    .no-form { font-size: 13px; color: #CBD5E1; }
    .weight-val  { font-size: 14px; font-weight: 600; white-space: nowrap; }
    .weight-unit { font-size: 11px; color: var(--t3); }
    .badge {
      display: inline-flex; align-items: center;
      font-size: 11px; font-weight: 700;
      padding: 3px 8px; border-radius: 12px;
      white-space: nowrap; line-height: 1.4;
    }
    .rec-win { background: #FEE2E2; color: #991B1B; }
    .rec-nw  { background: #EFF6FF; color: #1E40AF; }
    .rec-1st { background: #F0FDF4; color: #14532D; }
    .tri-row { display: inline-flex; gap: 3px; align-items: center; }
    .tri     { font-size: 15px; color: #CBD5E1; line-height: 1; }
    .tri-on  { color: #16A34A; }
    .trj-h   { background: #FFF7ED; color: #9A3412; }
    .trj-m   { background: #F0FDF4; color: #14532D; }
    .trj-l   { background: #F1F5F9; color: #475569; }

    /* ── Prediction box ── */
    .pred-box {
      background: linear-gradient(135deg, #EEF2FF, #fff);
      border-radius: 10px; margin: 8px;
      padding: 12px 14px; border: 1.5px solid #C7D2FE;
    }
    .pred-title  { font-size: 13px; font-weight: 700; color: var(--blue); margin-bottom: 8px; }
    .pred-panel > .pred-title {
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; list-style: none;
    }
    .pred-panel > .pred-title::-webkit-details-marker { display: none; }
    .pred-panel > .pred-title::marker { content: ''; }
    .pred-panel > .pred-title::before {
      content: ''; width: 0; height: 0; flex-shrink: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid currentColor;
      transition: transform .15s;
    }
    .pred-panel:not([open]) > .pred-title { margin-bottom: 0; }
    .pred-panel:not([open]) > .pred-title::before { transform: rotate(-90deg); }
    .pred-heading-label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .pred-order {
      display: none; margin-left: auto; white-space: nowrap;
      color: var(--blue); font-size: 13px; font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .pred-box-a2 .pred-order { color: #047857; }
    .pred-box-a3 .pred-order { color: #6D28D9; }
    .pred-box-a4 .pred-order { color: #9A3412; }
    .pred-panel:not([open]) .pred-order { display: inline-flex; }
    .pred-grid   { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
    .pred-slot   {
      padding: 9px 10px; background: #fff;
      border-radius: 7px; border: 1px solid #E0E8FF;
      box-shadow: 0 1px 3px rgba(0,63,136,.07);
    }
    .pred-rank   { font-size: 12px; margin-bottom: 3px; }
    .pred-horse  {
      font-size: 12px; font-weight: 700; color: var(--blue);
      margin-bottom: 6px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .pred-bar-wrap { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .pred-bar-bg   { flex: 1; height: 7px; background: #E5E7EB; border-radius: 4px; overflow: hidden; }
    .pred-bar      { height: 100%; border-radius: 4px; }
    .pred-s1 .pred-bar { background: var(--gold); }
    .pred-s2 .pred-bar { background: var(--silver); }
    .pred-s3 .pred-bar { background: var(--bronze); }
    .pred-s4 .pred-bar { background: #6B7280; }
    .pred-pct    { font-size: 11px; font-weight: 700; min-width: 28px; text-align: right; }
    .pred-s1 .pred-pct { color: #92660C; }
    .pred-s2 .pred-pct { color: #6B7280; }
    .pred-s3 .pred-pct { color: var(--bronze); }
    .pred-s4 .pred-pct { color: #6B7280; }
    .pred-reason { font-size: 10px; color: var(--t3); line-height: 1.4; }

    /* ── Prediction algorithm 2 ── */
    .pred-box-a2 {
      background: linear-gradient(135deg, #ECFDF5, #fff);
      border-color: #A7F3D0;
    }
    .pred-box-a2 .pred-title { color: #047857; }

    /* ── Prediction algorithm 3: 精算信度速度模型 ── */
    .pred-box-a3 {
      background: linear-gradient(135deg, #F5F3FF, #fff);
      border-color: #DDD6FE;
    }
    .pred-box-a3 .pred-title { color: #6D28D9; }
    .pred-box-a3 .pred-slot {
      border-color: #EDE9FE;
      box-shadow: 0 1px 3px rgba(109, 40, 217, 0.06);
    }

    /* ── Prediction algorithm 4: Grok4.7 玄機對弈 ── */
    .pred-box-a4 {
      background: linear-gradient(135deg, #FFF7ED, #fff 58%);
      border-color: #FDBA74;
    }
    .pred-box-a4 .pred-title { color: #9A3412; }
    .pred-box-a4 .pred-horse { color: #9A3412; }
    .pred-box-a4 .pred-slot {
      border-color: #FFEDD5;
      box-shadow: 0 1px 3px rgba(154, 52, 18, 0.06);
    }
    .pred-box-a5 {
      background: linear-gradient(135deg, #ECFEFF, #fff 58%);
      border-color: #67E8F9;
    }
    .pred-box-a5 .pred-title,
    .pred-box-a5 .pred-order,
    .pred-box-a5 .pred-horse { color: #0E7490; }
    .pred-box-a5 .pred-slot {
      border-color: #CFFAFE;
      box-shadow: 0 1px 3px rgba(14, 116, 144, 0.07);
    }
    .pred-insight {
      font-size: 11px; line-height: 1.5; color: #9A3412;
      background: rgba(255, 247, 237, 0.95);
      border: 1px dashed #FDBA74; border-radius: 6px;
      padding: 6px 8px; margin: 0 0 8px;
    }
    .pred-box-a5 .pred-insight {
      color: #0E7490;
      background: rgba(236, 254, 255, 0.95);
      border-color: #67E8F9;
    }
    /* ── Prediction algorithm 6: Deepseek Flash4.1 萃衡 ── */
    .pred-box-a6 {
      background: linear-gradient(135deg, #FFF1F2, #fff 58%);
      border-color: #FDA4AF;
    }
    .pred-box-a6 .pred-title,
    .pred-box-a6 .pred-order,
    .pred-box-a6 .pred-horse { color: #BE123C; }
    .pred-box-a6 .pred-slot {
      border-color: #FFE4E6;
      box-shadow: 0 1px 3px rgba(190, 18, 60, 0.06);
    }
    .pred-box-a6 .pred-insight {
      color: #BE123C;
      background: rgba(255, 241, 242, 0.95);
      border-color: #FDA4AF;
    }
    /* ── Prediction algorithm 7: GLM 5.3 Flash 格物致知 ── */
    .pred-box-a7 {
      background: linear-gradient(135deg, #F1F5F9, #fff 58%);
      border-color: #94A3B8;
    }
    .pred-box-a7 .pred-title,
    .pred-box-a7 .pred-order,
    .pred-box-a7 .pred-horse { color: #1E293B; }
    .pred-box-a7 .pred-slot {
      border-color: #E2E8F0;
      box-shadow: 0 1px 3px rgba(30, 41, 59, 0.07);
    }
    .pred-box-a7 .pred-insight {
      color: #1E293B;
      background: rgba(241, 245, 249, 0.95);
      border-color: #94A3B8;
    }
    .pred-badge-all, .pred-badge-unique {
      display: inline-block; font-size: 9px; font-weight: 700;
      color: #fff; border-radius: 6px;
      padding: 0 5px; margin-left: 4px; vertical-align: 1px;
    }
    .pred-badge-all { background: #9A3412; }
    .pred-badge-unique { background: #0F766E; }

    .pred-badge-common {
      display: inline-block; font-size: 9px; font-weight: 700;
      background: #F59E0B; color: #fff; border-radius: 6px;
      padding: 0 5px; margin-left: 4px; vertical-align: 1px;
    }
    .pred-actual { font-size: 10px; color: #047857; font-weight: 700; line-height: 1.4; }

    /* ── Race strip (mobile selector) ── */
    .race-strip {
      display: none;
      gap: 10px;
      padding: 10px 14px;
      background: var(--white);
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 50px;
      z-index: 100;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
    }
    .race-strip::-webkit-scrollbar { display: none; }
    .race-bubble {
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      cursor: pointer; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .rb-circle {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: #E8EFFF; color: var(--blue);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800;
      transition: background .15s, color .15s, transform .12s;
    }
    .race-bubble.active .rb-circle {
      background: var(--blue); color: #fff;
      transform: scale(1.08);
      box-shadow: 0 3px 8px rgba(0,63,136,.35);
    }


    /* ── Horse mobile stats row ── */
    .horse-meta-row {
      display: none;
      width: 100%;
      flex-wrap: wrap;
      gap: 5px;
      padding-top: 7px;
      margin-top: 4px;
      border-top: 1px solid #F0F0F0;
      align-items: center;
    }
    .hm-gate {
      font-size: 12px; font-weight: 700;
      color: var(--blue);
      background: #E8EFFF;
      padding: 2px 8px; border-radius: 10px;
    }
    .hm-weight { font-size: 12px; font-weight: 600; color: var(--t2); }

    /* ── Responsive ── */
    @media (max-width: 679px) {
      .layout { flex-direction: column; height: auto; }
      .race-panel { display: none; }
      .race-strip { display: flex; }
      .detail-panel {
        overflow: visible;
        min-height: calc(100vh - 168px);
      }
      .hdr { padding: 8px 14px; }
      .hdr-sub { display: none; }
      .hdr-title { font-size: 15px; }
      .hdr-race-day { font-size: 11px; margin-left: auto; }
      .horse-card {
        margin: 4px 6px; padding: 10px 12px;
        flex-wrap: wrap;
      }
      .horse-gw, .horse-rec, .horse-trj { display: none; }
      .horse-right { display: none; }
      .horse-meta-row { display: flex; }
      .h-name { font-size: 16px; }
      .card-legend { display: none; }
      .pred-grid { grid-template-columns: repeat(2,1fr); }
      .detail-title { font-size: 15px; }
      .detail-hdr { padding: 10px 12px; }
      .pred-box { margin: 6px; }
    }
  </style>
</head>
<body>

<!-- ── Loading overlay ────────────────────────────── -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-txt">載入賽事資料中…</div>
</div>

<!-- ── Header ─────────────────────────────────────── -->
<header class="hdr">
  <span class="hdr-icon">🏇</span>
  <div>
    <div class="hdr-title">HKJC 賽馬分析</div>
    <div class="hdr-sub">下場預測 · 馬匹分析工具</div>
  </div>
  <span class="hdr-race-day" id="hdrDate">—</span>
</header>

<!-- ── Full-page state (no race / error) ──────────── -->
<div class="fullstate hidden" id="fullstate">
  <div class="fi" id="fullstateIcon">📅</div>
  <div class="ft" id="fullstateTitle">今日沒有本地賽事</div>
  <div class="fs" id="fullstateMsg">請於下個賽事日再開啟此頁面。</div>
  <button class="retry-btn hidden" id="retryBtn" onclick="loadData()">重試</button>
</div>

<div class="race-strip hidden" id="raceStrip"></div>

<!-- ── Main Layout ────────────────────────────────── -->

  <!-- Left: Race list -->
  <nav class="race-panel" id="racePanel">
    <div class="panel-hdr">
      <div class="panel-hdr-title">本地賽事 · 下場分析</div>
      <div class="panel-hdr-date" id="panelDate">—</div>
      <div class="panel-hdr-badge">最新賽事卡</div>

    <div id="raceList"></div>

  <!-- Right: Detail -->
  <main class="detail-panel" id="detailPanel">
    <div class="empty-state" id="emptyState" hidden></div>
    <div id="detailContent" hidden></div>
  </main>

</div><!-- /layout -->

<script>
'use strict';

/* ── Config ──────────────────────────────────────── */
const SCRAPER_RAW = 'https://raw.githubusercontent.com/mzf3334-dev/hkjc_scraper/main';

/* ── State ───────────────────────────────────────── */
let D        = [];       // all historical rows parsed from all_results.csv
let RACECARD = null;     // today's racecard_today.json
let activeRace = null;   // currently selected race_no string

/* ── DOM refs ─────────────────────────────────────── */
const $overlay      = document.getElementById('loadingOverlay');
const $fullstate    = document.getElementById('fullstate');
const $mainLayout   = document.getElementById('mainLayout');
const $raceList     = document.getElementById('raceList');
const $emptyState   = document.getElementById('emptyState');
const $detailContent= document.getElementById('detailContent');
const $panelDate    = document.getElementById('panelDate');
const $hdrDate      = document.getElementById('hdrDate');
const $retryBtn     = document.getElementById('retryBtn');
const $raceStrip    = document.getElementById('raceStrip');

/* ── Helpers ─────────────────────────────────────── */
function stripCode(name) {
  return (name || '').replace(/\([^)]+\)\s*$/, '').trim();
}

function isValidRaceEntry(entry) {
  if (!entry) return false;
  const horseNo = String(entry.horse_no || '').trim();
  const horseName = String(entry.horse_name || '').trim();
  const jockey = String(entry.jockey || '').trim();
  const trainer = String(entry.trainer || '').trim();

  // Ignore placeholder rows such as "S1 日本:" and incomplete entries.
  if (!/^\d+$/.test(horseNo)) return false;
  if (!horseName || !jockey || !trainer) return false;
  return true;
}

function normalizeRacecardData(rawRacecard) {
  const races = Array.isArray(rawRacecard?.races) ? rawRacecard.races : [];
  const normalizedRaces = races
    .map(r => ({
      ...r,
      entries: (r.entries || []).filter(isValidRaceEntry),
    }))
    .filter(r => (r.entries || []).length > 0);

  return {
    ...rawRacecard,
    races: normalizedRaces,
  };
}

function buildPreviousRaceDemo(rows) {
  const nonFinishers = new Set(['PU', 'DNF', 'UR', 'FE']);
  const races = new Map();
  for (const row of rows) {
    const date = String(row[0] || '').trim();
    const raceNo = parseInt(row[1], 10);
    const position = String(row[4] || '').trim();
    const parsedPosition = parseInt(position, 10);
    if (!date || !Number.isInteger(raceNo) ||
        (!(Number.isInteger(parsedPosition) && parsedPosition > 0) && !nonFinishers.has(position.toUpperCase()))) continue;
    const key = `${date}|${raceNo}`;
    if (!races.has(key)) races.set(key, { date, raceNo, rows: [] });
    races.get(key).rows.push(row);
  }

  const latestDate = [...races.values()].map(race => race.date).sort().at(-1);
  if (!latestDate) throw new Error('歷史賽果中找不到可預覽的已完成賽事。');
  const demoRaces = [...races.values()]
    .filter(race => race.date === latestDate)
    .sort((a, b) => a.raceNo - b.raceNo)
    .map(race => ({
      race_no: String(race.raceNo),
      distance: String(race.rows[0][2] || '').trim(),
      going: String(race.rows[0][3] || '').trim(),
      entries: race.rows.map(row => ({
        horse_no: String(row[5] || '').trim(),
        horse_name: String(row[6] || '').trim(),
        jockey: String(row[7] || '').trim(),
        trainer: String(row[8] || '').trim(),
        weight: String(row[9] || '').trim(),
        gate: String(row[11] || '').trim(),
        actual_rank: String(row[4] || '').trim(),
      })).filter(isValidRaceEntry),
    }))
    .filter(race => race.entries.length >= 2);
  if (!demoRaces.length) throw new Error('最近賽馬日沒有足夠有效排位可供預覽。');

  return {
    history: rows.filter(row => String(row[0] || '').trim() < latestDate),
    racecard: {
      date: latestDate,
      demo: true,
      races: demoRaces,
    },
  };
}

function actualRankLabel2(entry) {
  const result = String((entry && entry.actual_rank) || '').trim();
  const rank = parseInt(result, 10);
  if (Number.isInteger(rank) && rank > 0) {
    return `實際第${rank}名${result.includes('平頭馬') ? '（平頭）' : ''}`;
  }
  return result ? `實際 ${result}` : '實際未有名次';
}

function horseCode(name) {
  const m = (name || '').match(/\(([^)]+)\)\s*$/);
  return m ? m[1] : '';
}

/* ── CSV parser ───────────────────────────────────── */
function parseCSV(text) {
  const lines = text.trim().split('\n');
  // Skip BOM + header, return array of arrays (same shape as prototype D)
  return lines.slice(1).map(l => {
    // Split on comma but respect quoted fields
    const cols = [];
    let cur = '', inQ = false;
    for (const ch of l) {
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur);
    return cols;
  }).filter(r => r.length >= 14);
}

/* ── Analytics (identical logic to prototype) ─────── */
function detectPos(incident, gate) {
  const t = incident || '';
  const isFront = ['領放', '居前列', '前列位置', '在領放馬'].some(k => t.includes(k));
  const isBack  = ['在馬群之後', '馬群後列', '後列', '居後', '在後', '馬群之後切入']
                    .some(k => t.includes(k));
  if (isFront && !isBack) return '前';
  if (isBack  && !isFront) return '後';
  if (isFront && isBack)   return '中';
  const g = parseInt(gate) || 7;
  if (g <= 4) return '前';
  if (g <= 8) return '中';
  return '後';
}

function typicalPos(horseName) {
  const rows = D.filter(r => stripCode(r[6]) === horseName);
  if (!rows.length) return '不明';
  const cnt = {};
  for (const r of rows) {
    const p = detectPos(r[13], r[11]);
    cnt[p] = (cnt[p] || 0) + 1;
  }
  return Object.entries(cnt).sort((a, b) => b[1] - a[1])[0][0];
}

function jockeyRecord(horseName, jockey) {
  const rows = D.filter(r => stripCode(r[6]) === horseName && r[7] === jockey);
  if (!rows.length) return { wins: 0, total: 0, label: '首次', hasWin: false };
  const wins  = rows.filter(r => r[4] === '1').length;
  const total = rows.length;
  return { wins, total, label: `${wins}勝/${total}場`, hasWin: wins > 0 };
}

function posTri(pos) {
  const active = pos === '前' ? 0 : pos === '後' ? 4 : pos === '中' ? 2 : -1;
  return '<span class="tri-row">' +
    [0,1,2,3,4].map(i => {
      const on = i === active;
      return `<span class="tri${on ? ' tri-on' : ''}">${on ? '\u25C0' : '\u25C1'}</span>`;
    }).join('') + '</span>';
}

function trainerJockeyWinPct(trainer, jockey) {
  const rows = D.filter(r => r[8] === trainer && r[7] === jockey);
  if (!rows.length) return { label: '師騎首次', cls: 'rec-1st' };
  const wins = rows.filter(r => r[4] === '1').length;
  const pct  = Math.round(wins / rows.length * 100);
  const cls  = pct >= 40 ? 'trj-h' : pct >= 20 ? 'trj-m' : 'trj-l';
  return { label: `師騎 ${pct}%`, cls };
}

function sameDistChips(horseName, dist) {
  const res = D
    .filter(r => stripCode(r[6]) === horseName && r[2] === dist)
    .sort((a, b) => b[0].localeCompare(a[0]))
    .slice(0, 4).map(r => r[4]);
  if (!res.length) return '<span class="no-form">—</span>';
  return res.map(rank => {
    const rk  = parseInt(rank) || 0;
    const cls = rank === 'PU' ? 'fc-pu'
              : rk === 1     ? 'fc-1'
              : rk <= 3      ? 'fc-top'
              : rk <= 6      ? 'fc-mid' : 'fc-tail';
    return `<span class="fchip ${cls}">${rank}</span>`;
  }).join('');
}

function buildPrediction(entries, dist) {
  const distNum = parseInt(dist) || 1200;
  // Convert racecard entries to D-format rows for scoring
  const rows = entries.map(e => [
    RACECARD.date, '', dist, '', '', e.horse_no, e.horse_name,
    e.jockey, e.trainer, e.weight, '', e.gate, '', ''
  ]);
  const scored = rows.map(r => {
    const horse   = stripCode(r[6]);
    const jockey  = r[7];
    const trainer = r[8];
    const gate    = parseInt(r[11]) || 8;
    let   score   = 0;
    const reasons = [];

    const recent = D.filter(x => stripCode(x[6]) === horse)
      .sort((a, b) => b[0].localeCompare(a[0])).slice(0, 5);
    if (recent.length) {
      const avg = recent.reduce((s, x) =>
        s + (x[4] === 'PU' ? 14 : (parseInt(x[4]) || 10)), 0) / recent.length;
      const pts = Math.max(0, 30 - avg * 2.5);
      score += pts;
      if (pts >= 18) reasons.push('近仗優秀');
    }

    const dRec = D.filter(x => stripCode(x[6]) === horse && x[2] === dist)
      .sort((a, b) => b[0].localeCompare(a[0])).slice(0, 4);
    if (dRec.length) {
      const avg = dRec.reduce((s, x) =>
        s + (x[4] === 'PU' ? 14 : (parseInt(x[4]) || 10)), 0) / dRec.length;
      const pts = Math.max(0, 25 - avg * 2);
      score += pts;
      if (pts >= 15) reasons.push('同程成績佳');
    }

    const jRaces = D.filter(x => x[7] === jockey);
    if (jRaces.length) {
      const rate = jRaces.filter(x => x[4] === '1').length / jRaces.length;
      score += rate * 20;
      if (rate >= 0.15) reasons.push('騎師勝率高');
    }

    const tjRaces = D.filter(x => x[7] === jockey && x[8] === trainer);
    if (tjRaces.length) {
      const rate = tjRaces.filter(x => x[4] === '1').length / tjRaces.length;
      score += rate * 15;
      if (rate >= 0.20) reasons.push('師騎配合佳');
    }

    if (distNum <= 1400 && gate <= 4) { score += 8; reasons.push('內檔有利'); }

    return { entry: entries.find(e => e.horse_no === r[5]), horse, score, reasons: reasons.slice(0, 2) };
  });
  return scored.sort((a, b) => b.score - a.score);
}

/* ════════════ 預測算法2：WOE 貝氏機率模型 ════════════ */
const A2 = {
  M: 10,
  WOE_CLAMP: 1.6,
  SCORE_CLAMP: 4.0,
  TEMP: 1.0,
  MIN_SAMPLE: 5,
  RECENT_DAYS: 90,
  RECENT_MIN: 10,
  W: {
    form: 0.16, dist: 0.13, going: 0.08, jockey: 0.13,
    trainer: 0.09, jTop3: 0.05, tTop3: 0.04, jh: 0.09,
    jt: 0.05, weight: 0.08, claim: 0.03, gate: 0.04, style: 0.03,
  },
};
let IDX2 = null;

const REASON_LABEL2 = {
  form: '近仗出色', dist: '同程往績佳', going: '場地合拍',
  jockey: '騎師強', trainer: '練馬師強', jTop3: '騎師榜前3',
  tTop3: '練馬師榜前3', jh: '人馬合拍', jt: '師騎配合佳',
  weight: '負磅有利', claim: '減磅優惠', gate: '檔位有利',
  style: '走位配檔佳',
};

function goingCategory2(value) {
  const going = String(value || '').trim();
  if (going === '好地至快地') return '快';
  if (going === '好地') return '好';
  if (going === '好地至黏地' || going === '黏地') return '黏';
  if (going === '軟地' || going === '濕快地' || going === '濕慢地') return '軟';
  if (going === '封地') return '封';
  return '其他';
}

function distBand2(distance) {
  const metres = parseInt(distance, 10) || 0;
  return metres <= 1400 ? '短途' : metres < 1800 ? '中途' : '長途';
}

function gateBucket2(gate) {
  const number = parseInt(gate, 10) || 0;
  return number <= 0 ? '' : number <= 3 ? '1-3' : number <= 7 ? '4-7' : number <= 11 ? '8-11' : '12+';
}

function weightBucket2(relativeWeight) {
  if (relativeWeight >= 4) return '輕磅優勢大';
  if (relativeWeight >= 1.5) return '略輕';
  if (relativeWeight > -1.5) return '中性';
  if (relativeWeight > -4) return '略重';
  return '重磅劣勢大';
}

function seasonOf2(date) {
  const year = Number(String(date || '').slice(0, 4));
  const month = Number(String(date || '').slice(5, 7));
  if (!Number.isFinite(year) || !Number.isFinite(month) || !year || !month) return null;
  return month >= 9 ? year : year - 1;
}

function dateEpoch2(date) {
  const match = String(date || '').match(/^(\d{4})\/(\d{2})\/(\d{2})$/);
  return match ? Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3])) : NaN;
}

function median2(values) {
  const sorted = values.filter(Number.isFinite).sort((a, b) => a - b);
  if (!sorted.length) return 0;
  const middle = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
}

function addStat2(stats, key, win) {
  if (key === null || key === undefined || key === '') return;
  let stat = stats.get(key);
  if (!stat) {
    stat = { starts: 0, wins: 0 };
    stats.set(key, stat);
  }
  stat.starts += 1;
  if (win) stat.wins += 1;
}

function mEstimate2(wins, starts) {
  const prior = IDX2 ? IDX2.p0 : 0.08;
  const sample = Math.max(0, Number(starts) || 0);
  return ((Number(wins) || 0) + A2.M * prior) / (sample + A2.M);
}

function woe2(probability) {
  if (!IDX2 || !Number.isFinite(probability) || probability <= 0) return 0;
  const value = Math.log(probability / IDX2.p0);
  return Math.max(-A2.WOE_CLAMP, Math.min(A2.WOE_CLAMP, value));
}

function woeForRows2(rows) {
  if (!rows || !rows.length) return 0;
  let wins = 0;
  for (const row of rows) if (row.win) wins += 1;
  return woe2(mEstimate2(wins, rows.length));
}

function buildWoeTable2(rows, keyOf, minStarts = 0) {
  const stats = new Map();
  for (const row of rows) addStat2(stats, keyOf(row), row.win);
  const table = new Map();
  for (const [key, stat] of stats) {
    table.set(key, stat.starts < minStarts ? 0 : woe2(mEstimate2(stat.wins, stat.starts)));
  }
  return table;
}

function pushIndex2(index, key, row) {
  if (!key) return;
  if (!index.has(key)) index.set(key, []);
  index.get(key).push(row);
}

function topThree2(counts) {
  return new Set([...counts.entries()]
    .sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0))
    .slice(0, 3)
    .map(([name]) => name));
}

function percentile2(values, quantile) {
  const sorted = values.filter(Number.isFinite).sort((a, b) => a - b);
  if (!sorted.length) return 0;
  const position = (sorted.length - 1) * quantile;
  const lower = Math.floor(position);
  const upper = Math.ceil(position);
  if (lower === upper) return sorted[lower];
  return sorted[lower] + (sorted[upper] - sorted[lower]) * (position - lower);
}

function claimEstimate2(rows) {
  if (!rows || !rows.length) return 0;
  // Positive relative weight means the jockey's mount carried less than the race median.
  const estimate = Math.max(0, Math.min(10, Math.round(percentile2(rows.map(row => row.relW), 0.25))));
  return [0, 2, 3, 5, 7, 10].reduce((best, value) =>
    Math.abs(value - estimate) < Math.abs(best - estimate) ? value : best, 0);
}

function historyBefore2(rows, asOfDate) {
  if (!rows || !asOfDate) return [];
  return rows.filter(row => row.date < asOfDate);
}

function recentRateWoe2(rows, asOfDate) {
  const history = historyBefore2(rows, asOfDate);
  if (!history.length) return 0;
  let wins = 0;
  for (const row of history) if (row.win) wins += 1;
  const careerRate = mEstimate2(wins, history.length);
  const asOfEpoch = dateEpoch2(asOfDate);
  if (!Number.isFinite(asOfEpoch)) return woe2(careerRate);
  const windowStart = asOfEpoch - A2.RECENT_DAYS * 86400000;
  const recent = history.filter(row => row.epoch >= windowStart && row.epoch < asOfEpoch);
  if (recent.length < A2.RECENT_MIN) return woe2(careerRate);
  let recentWins = 0;
  for (const row of recent) if (row.win) recentWins += 1;
  const recentRate = mEstimate2(recentWins, recent.length);
  return woe2(0.6 * careerRate + 0.4 * recentRate);
}

function latestHistory2(rows, asOfDate, limit) {
  const latest = [];
  if (!rows || !asOfDate) return latest;
  for (let index = rows.length - 1; index >= 0 && latest.length < limit; index -= 1) {
    if (rows[index].date < asOfDate) latest.push(rows[index]);
  }
  return latest;
}

function currentTopThree2(kind, asOfDate) {
  const key = `${kind}|${asOfDate}`;
  if (IDX2.top3Cache.has(key)) return IDX2.top3Cache.get(key);
  const season = seasonOf2(asOfDate);
  const counts = new Map();
  if (season !== null) {
    for (const row of IDX2.rows) {
      const name = kind === 'jockey' ? row.jockey : row.trainer;
      if (row.date >= asOfDate || seasonOf2(row.date) !== season || !row.win || !name) continue;
      counts.set(name, (counts.get(name) || 0) + 1);
    }
  }
  const result = { names: topThree2(counts), hasHistory: counts.size > 0 };
  IDX2.top3Cache.set(key, result);
  return result;
}

function buildIndexes2() {
  IDX2 = null;
  const styleCounts = new Map();
  for (const raw of D) {
    const horse = stripCode(raw[6]);
    if (!horse) continue;
    const position = detectPos(raw[13], raw[11]);
    if (!styleCounts.has(horse)) styleCounts.set(horse, new Map());
    const counts = styleCounts.get(horse);
    counts.set(position, (counts.get(position) || 0) + 1);
  }
  const styleOf = new Map();
  for (const [horse, counts] of styleCounts) {
    let bestPosition = '不明';
    let bestCount = 0;
    for (const [position, count] of counts) {
      if (count > bestCount) {
        bestPosition = position;
        bestCount = count;
      }
    }
    styleOf.set(horse, bestPosition);
  }

  const nonFinishers = new Set(['PU', 'DNF', 'UR', 'FE']);
  const rows = [];
  for (const raw of D) {
    const date = String(raw[0] || '').trim();
    const raceNumber = parseInt(raw[1], 10);
    const positionText = String(raw[4] || '').trim();
    const numericPosition = parseInt(positionText, 10);
    const isPlacedResult = Number.isInteger(numericPosition) && numericPosition > 0;
    if (!date || !Number.isInteger(raceNumber) || (!isPlacedResult && !nonFinishers.has(positionText.toUpperCase()))) continue;
    const horse = stripCode(raw[6]);
    if (!horse) continue;
    const epoch = dateEpoch2(date);
    if (!Number.isFinite(epoch)) continue;
    rows.push({
      date,
      epoch,
      raceNo: raceNumber,
      raceKey: `${date}|${raceNumber}`,
      dist: String(raw[2] || '').trim(),
      goingCat: goingCategory2(raw[3]),
      rank: isPlacedResult ? numericPosition : 99,
      win: numericPosition === 1,
      horse,
      jockey: String(raw[7] || '').trim(),
      trainer: String(raw[8] || '').trim(),
      weight: parseFloat(raw[9]) || 0,
      gate: parseInt(raw[11], 10) || 0,
      style: styleOf.get(horse) || '不明',
      relW: 0,
      claim: 0,
      jTop3: false,
      tTop3: false,
    });
  }
  rows.sort((a, b) => a.date.localeCompare(b.date) || a.raceNo - b.raceNo);

  const raceWeights = new Map();
  for (const row of rows) {
    if (row.weight <= 0) continue;
    if (!raceWeights.has(row.raceKey)) raceWeights.set(row.raceKey, []);
    raceWeights.get(row.raceKey).push(row.weight);
  }
  const raceMedW = new Map();
  for (const [raceKey, weights] of raceWeights) raceMedW.set(raceKey, median2(weights));
  for (const row of rows) {
    const medianWeight = raceMedW.get(row.raceKey) || 0;
    row.relW = medianWeight > 0 && row.weight > 0 ? medianWeight - row.weight : 0;
  }

  const raceGroups = [];
  for (const row of rows) {
    let group = raceGroups[raceGroups.length - 1];
    if (!group || group[0].raceKey !== row.raceKey) {
      group = [];
      raceGroups.push(group);
    }
    group.push(row);
  }
  const jockeyWins = new Map();
  const trainerWins = new Map();
  const jockeyHistory = new Map();
  let activeSeason = null;
  for (const group of raceGroups) {
    const season = seasonOf2(group[0].date);
    if (season !== activeSeason) {
      jockeyWins.clear();
      trainerWins.clear();
      activeSeason = season;
    }
    const topJockeys = topThree2(jockeyWins);
    const topTrainers = topThree2(trainerWins);
    for (const row of group) {
      row.jTop3 = topJockeys.has(row.jockey);
      row.tTop3 = topTrainers.has(row.trainer);
      row.claim = claimEstimate2(jockeyHistory.get(row.jockey) || []);
    }
    for (const row of group) {
      if (row.win && row.jockey) jockeyWins.set(row.jockey, (jockeyWins.get(row.jockey) || 0) + 1);
      if (row.win && row.trainer) trainerWins.set(row.trainer, (trainerWins.get(row.trainer) || 0) + 1);
      if (row.jockey) {
        if (!jockeyHistory.has(row.jockey)) jockeyHistory.set(row.jockey, []);
        jockeyHistory.get(row.jockey).push(row);
      }
    }
  }

  const wins = rows.reduce((total, row) => total + (row.win ? 1 : 0), 0);
  const rawPrior = rows.length ? wins / rows.length : 0.08;
  const p0 = Math.max(0.000001, Math.min(0.999999, rawPrior));
  const byHorse = new Map();
  const byJockey = new Map();
  const byTrainer = new Map();
  const byHorseJockey = new Map();
  const byJockeyTrainer = new Map();
  for (const row of rows) {
    pushIndex2(byHorse, row.horse, row);
    pushIndex2(byJockey, row.jockey, row);
    pushIndex2(byTrainer, row.trainer, row);
    if (row.jockey) pushIndex2(byHorseJockey, `${row.horse}\u0000${row.jockey}`, row);
    if (row.jockey && row.trainer) pushIndex2(byJockeyTrainer, `${row.jockey}\u0000${row.trainer}`, row);
  }

  const claimOf = new Map();
  for (const [jockey, history] of jockeyHistory) claimOf.set(jockey, claimEstimate2(history));
  IDX2 = {
    rows, p0, byHorse, byJockey, byTrainer, byHorseJockey, byJockeyTrainer,
    raceMedW, styleOf, claimOf, top3Cache: new Map(),
  };
  IDX2.woeGate = buildWoeTable2(rows, row => gateBucket2(row.gate));
  IDX2.woeGateDist = buildWoeTable2(rows, row => {
    const bucket = gateBucket2(row.gate);
    return bucket ? `${distBand2(row.dist)}|${bucket}` : null;
  }, 30);
  IDX2.woeWeight = buildWoeTable2(rows, row =>
    row.weight > 0 && raceMedW.has(row.raceKey) ? weightBucket2(row.relW) : null);
  IDX2.woeClaim = buildWoeTable2(rows, row => row.jockey ? String(row.claim) : null, 30);
  IDX2.woeStyle = buildWoeTable2(rows, row => {
    const bucket = gateBucket2(row.gate);
    return bucket && row.style !== '不明' ? `${row.style}|${bucket}` : null;
  }, 30);
  IDX2.woeJTop3 = buildWoeTable2(rows, row => row.jockey ? (row.jTop3 ? 'Y' : 'N') : null);
  IDX2.woeTTop3 = buildWoeTable2(rows, row => row.trainer ? (row.tTop3 ? 'Y' : 'N') : null);
}

function buildPrediction2(entries, race) {
  if (!IDX2 || !entries || entries.length < 2) return [];
  const asOfDate = String((race && race.date) || (RACECARD && RACECARD.date) || '');
  const distance = String((race && race.distance) || '');
  const distanceNumber = parseInt(distance, 10) || 1200;
  const distanceBand = distBand2(distance);
  const goingCat = goingCategory2(race && race.going);
  const weights = entries.map(entry => parseFloat(entry.weight)).filter(weight => Number.isFinite(weight) && weight > 0);
  const fieldMedianWeight = median2(weights);
  const distanceFactor = Math.max(0.8, Math.min(1.5, distanceNumber / 1400));
  const topJockeys = currentTopThree2('jockey', asOfDate);
  const topTrainers = currentTopThree2('trainer', asOfDate);

  const scored = entries.map(entry => {
    const horse = stripCode(entry.horse_name);
    const jockey = String(entry.jockey || '').trim();
    const trainer = String(entry.trainer || '').trim();
    const history = historyBefore2(IDX2.byHorse.get(horse), asOfDate);
    const jockeyHistory = historyBefore2(IDX2.byJockey.get(jockey), asOfDate);
    const trainerHistory = historyBefore2(IDX2.byTrainer.get(trainer), asOfDate);
    const horseJockeyHistory = historyBefore2(IDX2.byHorseJockey.get(`${horse}\u0000${jockey}`), asOfDate);
    const jockeyTrainerHistory = historyBefore2(IDX2.byJockeyTrainer.get(`${jockey}\u0000${trainer}`), asOfDate);
    const parts = [];
    let score = 0;
    const add = (key, value) => {
      const factorWoe = Number.isFinite(value) ? Math.max(-A2.WOE_CLAMP, Math.min(A2.WOE_CLAMP, value)) : 0;
      const contribution = A2.W[key] * factorWoe;
      score += contribution;
      parts.push({ key, contribution });
    };

    const recentForm = latestHistory2(IDX2.byHorse.get(horse), asOfDate, 5);
    if (recentForm.length) {
      let formPoints = 0;
      for (const row of recentForm) {
        formPoints += row.win ? 1 : row.rank <= 3 ? 0.6 : row.rank === 4 ? 0.3 : 0;
      }
      add('form', woe2(mEstimate2(formPoints, recentForm.length)));
    }

    const exactDistance = history.filter(row => row.dist === distance);
    const distanceHistory = exactDistance.length >= A2.MIN_SAMPLE
      ? exactDistance
      : history.filter(row => distBand2(row.dist) === distanceBand);
    add('dist', woeForRows2(distanceHistory));
    add('going', woeForRows2(history.filter(row => row.goingCat === goingCat)));
    add('jockey', recentRateWoe2(IDX2.byJockey.get(jockey), asOfDate));
    add('trainer', recentRateWoe2(IDX2.byTrainer.get(trainer), asOfDate));
    if (topJockeys.hasHistory) add('jTop3', IDX2.woeJTop3.get(topJockeys.names.has(jockey) ? 'Y' : 'N') || 0);
    if (topTrainers.hasHistory) add('tTop3', IDX2.woeTTop3.get(topTrainers.names.has(trainer) ? 'Y' : 'N') || 0);
    add('jh', woeForRows2(horseJockeyHistory));
    add('jt', woeForRows2(jockeyTrainerHistory));

    const carriedWeight = parseFloat(entry.weight);
    if (fieldMedianWeight > 0 && Number.isFinite(carriedWeight) && carriedWeight > 0) {
      const weightWoe = IDX2.woeWeight.get(weightBucket2(fieldMedianWeight - carriedWeight)) || 0;
      add('weight', weightWoe * distanceFactor);
    }
    const claim = claimEstimate2(jockeyHistory);
    add('claim', IDX2.woeClaim.get(String(claim)) || 0);

    const gate = parseInt(entry.gate, 10) || 0;
    const gateBucket = gateBucket2(gate);
    if (gateBucket) {
      const gateWoe = IDX2.woeGateDist.get(`${distanceBand}|${gateBucket}`);
      add('gate', gateWoe === undefined ? (IDX2.woeGate.get(gateBucket) || 0) : gateWoe);
      const style = IDX2.styleOf.get(horse) || '不明';
      if (style !== '不明') add('style', IDX2.woeStyle.get(`${style}|${gateBucket}`) || 0);
    }

    score = Math.max(-A2.SCORE_CLAMP, Math.min(A2.SCORE_CLAMP, score));
    const reasons = parts.filter(part => part.contribution > 0.01)
      .sort((a, b) => b.contribution - a.contribution)
      .slice(0, 2)
      .map(part => REASON_LABEL2[part.key]);
    return { entry, horse, score, reasons };
  });

  const maxScore = Math.max(...scored.map(item => item.score));
  const exponentials = scored.map(item => Math.exp((item.score - maxScore) / A2.TEMP));
  const total = exponentials.reduce((sum, value) => sum + value, 0) || 1;
  scored.forEach((item, index) => { item.prob = exponentials[index] / total; });
  return scored.sort((a, b) => b.prob - a.prob || Number(a.entry.horse_no) - Number(b.entry.horse_no));
}

/* ════════════ 預測算法3：精算信度速度模型 (Actuarial Credibility & Speed Model) ════════════ */
const A3 = {
  HALF_LIFE_DAYS: 120,    // 時間衰減半衰期 (120天)
  K_HORSE: 4.0,           // 馬匹實力 Bühlmann-Straub 信度常數
  K_JOCKEY: 18.0,         // 騎師信度常數
  K_TRAINER: 22.0,        // 練馬師信度常數
  K_JT: 6.0,              // 師騎組合信度常數
  WEIGHT_COEFF: 0.045,    // 每磅負磅相對於1400米基準彈性係數
  TEMP: 0.85,             // 多項 Logit 溫度係數
};
let IDX3 = null;

function parseTimeSeconds3(timeStr) {
  if (!timeStr) return null;
  const match = String(timeStr).trim().match(/^(\d+):(\d+\.?\d*)$/);
  if (!match) return null;
  const sec = parseInt(match[1], 10) * 60 + parseFloat(match[2]);
  return Number.isFinite(sec) && sec > 30 && sec < 250 ? sec : null;
}

function buildIndexes3() {
  IDX3 = null;
  const timeByDG = new Map();
  const timeByD = new Map();

  for (const r of D) {
    const sec = parseTimeSeconds3(r[12]);
    if (!sec) continue;
    const dist = String(r[2] || '').trim();
    const goingCat = goingCategory2(r[3]);
    const key = dist + '|' + goingCat;
    if (!timeByDG.has(key)) timeByDG.set(key, []);
    timeByDG.get(key).push(sec);
    if (!timeByD.has(dist)) timeByD.set(dist, []);
    timeByD.get(dist).push(sec);
  }

  function computeBenchmark(list) {
    if (!list || list.length < 3) return null;
    const sorted = [...list].sort((a, b) => a - b);
    const med = sorted[Math.floor(sorted.length / 2)];
    const mean = sorted.reduce((s, x) => s + x, 0) / sorted.length;
    const variance = sorted.reduce((s, x) => s + (x - mean) ** 2, 0) / sorted.length;
    const std = Math.max(0.4, Math.sqrt(variance));
    return { med, std };
  }

  const bmDG = new Map();
  for (const [key, list] of timeByDG) {
    const bm = computeBenchmark(list);
    if (bm) bmDG.set(key, bm);
  }
  const bmD = new Map();
  for (const [key, list] of timeByD) {
    const bm = computeBenchmark(list);
    if (bm) bmD.set(key, bm);
  }

  const byHorse = new Map();
  const byJockey = new Map();
  const byTrainer = new Map();
  const byJT = new Map();

  let winsCount = 0;
  let placesCount = 0;
  let totalValid = 0;

  for (const r of D) {
    const date = String(r[0] || '').trim();
    const epoch = dateEpoch2(date);
    if (!Number.isFinite(epoch)) continue;
    const horse = stripCode(r[6]);
    if (!horse) continue;
    const jockey = String(r[7] || '').trim();
    const trainer = String(r[8] || '').trim();
    const dist = String(r[2] || '').trim();
    const goingCat = goingCategory2(r[3]);
    const rankStr = String(r[4] || '').trim();
    const rankNum = parseInt(rankStr, 10);
    const isFinished = Number.isInteger(rankNum) && rankNum > 0;
    const rank = isFinished ? rankNum : 99;
    const isWin = rank === 1;
    const isPlace = rank >= 1 && rank <= 3;
    totalValid += 1;
    if (isWin) winsCount += 1;
    if (isPlace) placesCount += 1;

    const timeSec = parseTimeSeconds3(r[12]);
    const bm = bmDG.get(dist + '|' + goingCat) || bmD.get(dist);
    let speedFig = 0;
    if (bm && timeSec) {
      speedFig = Math.max(-2.5, Math.min(2.5, (bm.med - timeSec) / bm.std));
    }

    const rowObj = {
      date, epoch, dist, goingCat, rank, isWin, isPlace,
      speedFig, weight: parseFloat(r[9]) || 0, gate: parseInt(r[11], 10) || 0
    };

    if (!byHorse.has(horse)) byHorse.set(horse, []);
    byHorse.get(horse).push(rowObj);

    if (jockey) {
      if (!byJockey.has(jockey)) byJockey.set(jockey, []);
      byJockey.get(jockey).push(rowObj);
    }
    if (trainer) {
      if (!byTrainer.has(trainer)) byTrainer.set(trainer, []);
      byTrainer.get(trainer).push(rowObj);
    }
    if (jockey && trainer) {
      const jtKey = jockey + '\u0000' + trainer;
      if (!byJT.has(jtKey)) byJT.set(jtKey, []);
      byJT.get(jtKey).push(rowObj);
    }
  }

  const p0Win = totalValid ? winsCount / totalValid : 0.08;
  const p0Place = totalValid ? placesCount / totalValid : 0.24;

  IDX3 = {
    byHorse, byJockey, byTrainer, byJT,
    bmDG, bmD, p0Win, p0Place
  };
}

function buildPrediction3(entries, race) {
  if (!IDX3 || !entries || entries.length < 2) return [];
  const asOfDate = String((race && race.date) || (RACECARD && RACECARD.date) || '');
  const distance = String((race && race.distance) || '');
  const distanceNumber = parseInt(distance, 10) || 1200;
  const asOfEpoch = dateEpoch2(asOfDate);

  const weights = entries.map(e => parseFloat(e.weight)).filter(w => Number.isFinite(w) && w > 0);
  const sortedWeights = [...weights].sort((a, b) => a - b);
  const medWeight = sortedWeights.length ? sortedWeights[Math.floor(sortedWeights.length / 2)] : 125;

  const scored = entries.map(entry => {
    const horse = stripCode(entry.horse_name);
    const jockey = String(entry.jockey || '').trim();
    const trainer = String(entry.trainer || '').trim();
    const weight = parseFloat(entry.weight) || medWeight;
    const gate = parseInt(entry.gate, 10) || 0;

    // 1. 馬匹速度與近況 (時間指數衰減與信度加權)
    const hAll = IDX3.byHorse.get(horse) || [];
    const hHistory = hAll.filter(r => r.date < asOfDate);
    let hatSpeed = 0;
    let hatForm = 0;
    let volPenalty = 0;
    let distSpeedMax = -999;

    if (hHistory.length) {
      let wSum = 0;
      let sSum = 0;
      let fSum = 0;
      const ranks = [];
      for (const run of hHistory) {
        const elapsedDays = Number.isFinite(asOfEpoch) && Number.isFinite(run.epoch)
          ? Math.max(0, (asOfEpoch - run.epoch) / 86400000) : 180;
        const decay = Math.exp(-elapsedDays / A3.HALF_LIFE_DAYS);
        const distMult = (run.dist === distance) ? 1.3 : 0.8;
        const weightFactor = decay * distMult;
        wSum += weightFactor;
        sSum += run.speedFig * weightFactor;
        const formPt = run.isWin ? 1.0 : run.isPlace ? 0.6 : (run.rank <= 5 ? 0.25 : 0.0);
        fSum += formPt * weightFactor;
        ranks.push(run.rank);
        if (run.dist === distance && run.speedFig > distSpeedMax) {
          distSpeedMax = run.speedFig;
        }
      }

      const meanSpeed = wSum > 0 ? sSum / wSum : 0;
      const meanForm = wSum > 0 ? fSum / wSum : 0;
      const zH = hHistory.length / (hHistory.length + A3.K_HORSE);
      hatSpeed = zH * meanSpeed;
      hatForm = zH * (meanForm - IDX3.p0Place);

      if (ranks.length >= 3) {
        const meanR = ranks.reduce((s, x) => s + x, 0) / ranks.length;
        const varR = ranks.reduce((s, x) => s + (x - meanR) ** 2, 0) / ranks.length;
        const stdR = Math.sqrt(varR);
        volPenalty = 0.08 * Math.min(2.5, stdR / 3.5);
      }
    }

    // 2. 騎師信度期望值
    const jAll = IDX3.byJockey.get(jockey) || [];
    const jHistory = jAll.filter(r => r.date < asOfDate);
    let jScore = 0;
    if (jHistory.length) {
      const zJ = jHistory.length / (jHistory.length + A3.K_JOCKEY);
      const winRate = jHistory.filter(r => r.isWin).length / jHistory.length;
      const plcRate = jHistory.filter(r => r.isPlace).length / jHistory.length;
      jScore = zJ * (0.6 * (plcRate - IDX3.p0Place) + 0.4 * (winRate - IDX3.p0Win));
    }

    // 3. 練馬師信度期望值
    const tAll = IDX3.byTrainer.get(trainer) || [];
    const tHistory = tAll.filter(r => r.date < asOfDate);
    let tScore = 0;
    if (tHistory.length) {
      const zT = tHistory.length / (tHistory.length + A3.K_TRAINER);
      const plcRate = tHistory.filter(r => r.isPlace).length / tHistory.length;
      tScore = zT * (plcRate - IDX3.p0Place);
    }

    // 4. 騎練搭檔協同信度
    const jtKey = jockey + '\u0000' + trainer;
    const jtAll = IDX3.byJT.get(jtKey) || [];
    const jtHistory = jtAll.filter(r => r.date < asOfDate);
    let jtScore = 0;
    if (jtHistory.length) {
      const zJT = jtHistory.length / (jtHistory.length + A3.K_JT);
      const winRate = jtHistory.filter(r => r.isWin).length / jtHistory.length;
      jtScore = zJT * (winRate - IDX3.p0Win);
    }

    // 5. 負磅邊際彈性
    const distFactor = distanceNumber / 1400;
    const weightDelta = weight - medWeight;
    const weightAdj = -A3.WEIGHT_COEFF * distFactor * weightDelta;

    // 6. 跑道幾何與檔位優勢
    let gateAdj = 0;
    if (distanceNumber <= 1400) {
      if (gate >= 1 && gate <= 3) gateAdj = 0.16;
      else if (gate >= 4 && gate <= 6) gateAdj = 0.08;
      else if (gate >= 7 && gate <= 9) gateAdj = -0.04;
      else if (gate >= 10) gateAdj = -0.15;
    } else {
      if (gate >= 1 && gate <= 4) gateAdj = 0.08;
      else if (gate >= 11) gateAdj = -0.08;
    }

    const utility = (
      1.20 * hatSpeed +
      1.10 * hatForm +
      0.95 * jScore +
      0.70 * tScore +
      0.55 * jtScore +
      weightAdj +
      gateAdj -
      volPenalty
    );

    // 精算理由分析
    const reasonCandidates = [];
    if (hatSpeed >= 0.45) reasonCandidates.push({ label: '速度指數頂尖', val: hatSpeed * 1.2 });
    else if (hatSpeed >= 0.18) reasonCandidates.push({ label: '速度優勢', val: hatSpeed * 1.2 });

    if (distSpeedMax >= 0.6) reasonCandidates.push({ label: '同程極速往績', val: 0.5 });
    if (hatForm >= 0.15) reasonCandidates.push({ label: '近仗動量充沛', val: hatForm * 1.1 });
    if (weightAdj >= 0.12) reasonCandidates.push({ label: '負磅優勢顯著', val: weightAdj });
    if (gateAdj >= 0.12) reasonCandidates.push({ label: '黃金內檔幾何', val: gateAdj });
    if (jScore >= 0.07) reasonCandidates.push({ label: '騎師高信度', val: jScore * 0.95 });
    if (jtScore >= 0.04) reasonCandidates.push({ label: '師騎強勢組合', val: jtScore * 0.55 });
    if (hHistory.length >= 3 && volPenalty <= 0.03) reasonCandidates.push({ label: '走勢穩健低險', val: 0.35 });

    reasonCandidates.sort((a, b) => b.val - a.val);
    let reasons = reasonCandidates.slice(0, 2).map(r => r.label);
    if (!reasons.length) {
      reasons = hHistory.length < 2 ? ['新出/少賽審慎'] : ['綜合評分均衡'];
    }

    return {
      entry, horse, score: utility, reasons
    };
  });

  const maxScore = Math.max(...scored.map(item => item.score));
  const exps = scored.map(item => Math.exp((item.score - maxScore) / A3.TEMP));
  const sumExp = exps.reduce((s, x) => s + x, 0) || 1;
  scored.forEach((item, idx) => {
    item.prob = exps[idx] / sumExp;
  });

  return scored.sort((a, b) => b.prob - a.prob || Number(a.entry.horse_no) - Number(b.entry.horse_no));
}

/* ════════════ 預測算法4：Grok4.7 玄機對弈 ════════════
   不以獨立勝率堆分數。先把每仗完成時間換成「落後頭馬長度」，
   扣走負磅、檔位與受阻行程，再按對手實力回推隱性評分；
   今日則重算減磅、檔位、步速對壘與換騎，用 Plackett-Luce 排出最可能名次。
   排位表「負磅」是分配磅，學徒減磅寫在騎師名後，實負 = 分配磅 − 減磅。 */
const A4 = {
  HALF_LIFE: 118,
  PERSON_HALF: 170,
  K_HORSE: 2.2,
  K_JOCKEY: 18,
  K_TRAINER: 24,
  JOCKEY_SCALE: 8,
  LB_PER_LB: 0.11,
  SPEED_BLEND: 0.16,
  W_DIST: 0.5,
  W_JOCKEY: 0.58,
  W_UPGRADE: 0.42,
  W_JHOT: 0.3,
  W_TRAINER: 0.38,
  W_THOT: 0.45,
  W_PACE: 0.75,
  W_CLASS: 0.4,
  W_LAST: 0.1,
  W_BOUNCE: 0.3,
  W_FORM: 2,
  W_VOL: 1.35,
  PLACE_MIX: 0.76,
  DRAW_K: 42,
  TEMP: 2.55,
};
const A5 = {
  MODEL_WEIGHTS: [0.1, 0.1, 0.2, 0.6],
  SCORE_SCALE: 24,
  TEMP: 2.55,
};
let IDX4 = null;

function clamp4(value, lo, hi) {
  if (!Number.isFinite(value)) return 0;
  return Math.max(lo, Math.min(hi, value));
}

function parseRank4(text) {
  const raw = String(text || '').trim();
  if (!raw || raw === '---') return null;
  const upper = raw.toUpperCase();
  if (upper.startsWith('WV') || upper.startsWith('TNP') || upper === 'SCR') return { kind: 'scratch' };
  const rank = parseInt(raw, 10);
  if (Number.isInteger(rank) && rank > 0) return { kind: 'finish', rank };
  if (/PU|UR|DNF|FE|DISQ|BD|RO/.test(upper)) return { kind: 'dnf' };
  return null;
}

function parseRider4(raw) {
  const text = String(raw || '').trim();
  const matched = text.match(/[（(]\s*-\s*(\d+)\s*[）)]/);
  const claim = matched ? Math.min(10, parseInt(matched[1], 10) || 0) : 0;
  const name = text.replace(/\s*[（(]\s*-\s*\d+\s*[）)]\s*/g, '').replace(/---/g, '').trim();
  return { name, claim };
}

function inferVenue4(distM) {
  if (distM === 1650) return 'HV';
  if (distM === 1400 || distM === 1600 || distM === 2000 || distM === 2400) return 'ST';
  return '';
}

function distBand4(distM) {
  if (distM <= 1000) return '1000';
  if (distM <= 1200) return '1200';
  if (distM <= 1400) return '1400';
  if (distM <= 1650) return '1650';
  if (distM <= 1800) return '1800';
  if (distM <= 2000) return '2000';
  return '2200+';
}

function gateBucket4(gate) {
  if (gate <= 3) return '1-3';
  if (gate <= 6) return '4-6';
  if (gate <= 9) return '7-9';
  if (gate <= 12) return '10-12';
  return '13+';
}

function tripScore4(note) {
  const text = String(note || '');
  let bonus = 0;
  if (/受阻|受困|未能望空|無路可上|受擠|勒避|被困/.test(text)) bonus += 1.05;
  if (/走外疊|大外疊|走三疊|沒有遮擋/.test(text)) bonus += 0.55;
  if (/出閘緩慢|出閘笨拙|起步慢|起步緩慢|出閘不佳/.test(text)) bonus += 0.3;
  else if (/出閘僅屬一般/.test(text)) bonus += 0.18;
  if (/失蹄|失去平衡|大力碰撞/.test(text)) bonus += 0.28;
  if (/包尾大敗/.test(text)) bonus -= 0.35;
  return clamp4(bonus, -0.4, 2);
}

function styleFromNote4(note) {
  const text = String(note || '');
  const front = /領放|居前列|前列位置|在領放馬|帶頭/.test(text);
  const back = /在馬群之後|馬群後列|後列|居後|在後|包尾/.test(text);
  if (front && !back) return 1;
  if (back && !front) return -1;
  if (front && back) return 0;
  return null;
}

function venueDrawPrior4(venue, distM, gate) {
  const code = String(venue || '').toUpperCase();
  if (!code || gate <= 0) return 0;
  if (code === 'ST' || code === 'S') {
    if (distM <= 1000) {
      if (gate <= 4) return 0.3;
      if (gate <= 7) return 0.06;
      if (gate >= 12) return -0.36;
      if (gate >= 9) return -0.14;
    } else if (distM <= 1200) {
      if (gate <= 3) return 0.24;
      if (gate <= 6) return 0.07;
      if (gate >= 12) return -0.32;
      if (gate >= 9) return -0.12;
    } else if (distM <= 1400) {
      if (gate <= 3) return 0.1;
      if (gate >= 12) return -0.14;
    } else if (gate <= 4) return 0.04;
    else if (gate >= 12) return -0.05;
  }
  if (code === 'HV' || code === 'H') {
    if (distM <= 1200) {
      if (gate <= 3) return 0.16;
      if (gate >= 11) return -0.26;
    } else if (gate >= 11) return -0.08;
  }
  return 0;
}

function decayedMean4(items, asOfEpoch, valueOf, weightOf) {
  let wSum = 0;
  let vSum = 0;
  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    if (!(item.epoch < asOfEpoch)) continue;
    const value = valueOf(item);
    if (!Number.isFinite(value)) continue;
    const days = Math.max(0, (asOfEpoch - item.epoch) / 86400000);
    const w = Math.exp(-days / A4.HALF_LIFE) * (weightOf ? weightOf(item) : 1);
    wSum += w;
    vSum += value * w;
  }
  return { mean: wSum ? vSum / wSum : 0, nEff: wSum };
}

function riderScore4(runs, asOfEpoch, p0Win, p0Place, k) {
  let wSum = 0;
  let winSum = 0;
  let plcSum = 0;
  let n = 0;
  if (!runs) return { score: 0, n: 0 };
  for (let i = 0; i < runs.length; i++) {
    const run = runs[i];
    if (!(run.epoch < asOfEpoch)) continue;
    const days = Math.max(0, (asOfEpoch - run.epoch) / 86400000);
    const w = Math.exp(-days / A4.PERSON_HALF);
    wSum += w;
    n += 1;
    if (run.win) winSum += w;
    if (run.place) plcSum += w;
  }
  if (wSum <= 0) return { score: 0, n: 0 };
  const z = wSum / (wSum + k);
  const mix = Number.isFinite(A4.PLACE_MIX) ? A4.PLACE_MIX : 0.5;
  const score = z * (mix * ((plcSum / wSum) - p0Place) + (1 - mix) * ((winSum / wSum) - p0Win)) * A4.JOCKEY_SCALE;
  return { score, n };
}

function hotEdge4(runs, asOfEpoch, windowDays, minStarts) {
  if (!runs || !runs.length) return 0;
  let careerN = 0;
  let careerW = 0;
  let recentN = 0;
  let recentW = 0;
  const start = asOfEpoch - windowDays * 86400000;
  for (let i = 0; i < runs.length; i++) {
    const run = runs[i];
    if (!(run.epoch < asOfEpoch)) continue;
    careerN += 1;
    if (run.win) careerW += 1;
    if (run.epoch >= start) {
      recentN += 1;
      if (run.win) recentW += 1;
    }
  }
  if (recentN < minStarts || careerN < recentN + 5) return 0;
  return recentW / recentN - careerW / careerN;
}

function plProbs4(utilities, temperature = A4.TEMP) {
  const maxU = Math.max.apply(null, utilities);
  const s = utilities.map(u => Math.exp(((Number.isFinite(u) ? u : 0) - maxU) / temperature));
  const total = s.reduce((sum, value) => sum + value, 0) || 1;
  const n = s.length;
  const win = s.map(value => value / total);
  const place = new Array(n).fill(0);
  if (n < 3) {
    for (let i = 0; i < n; i++) place[i] = 1;
    return { win, place };
  }
  for (let i = 0; i < n; i++) {
    const p1 = s[i] / total;
    const rest1 = total - s[i];
    if (rest1 <= 0) continue;
    for (let j = 0; j < n; j++) {
      if (j === i) continue;
      const p2 = s[j] / rest1;
      const rest2 = rest1 - s[j];
      if (rest2 <= 0) continue;
      for (let k = 0; k < n; k++) {
        if (k === i || k === j) continue;
        const p = p1 * p2 * (s[k] / rest2);
        place[i] += p;
        place[j] += p;
        place[k] += p;
      }
    }
  }
  return { win, place };
}

function buildIndexes4() {
  IDX4 = null;
  const byHorse = new Map();
  const byJockey = new Map();
  const byTrainer = new Map();
  const roster = new Map();
  const raceMap = new Map();
  const races = [];
  const timesDG = new Map();
  const timesD = new Map();
  let wins = 0;
  let places = 0;
  let finishers = 0;

  const pushRun = (map, key, row) => {
    if (!key) return;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(row);
  };

  for (let i = 0; i < D.length; i++) {
    const raw = D[i];
    const date = String(raw[0] || '').trim();
    const epoch = dateEpoch2(date);
    const rankInfo = parseRank4(raw[4]);
    if (!date || !Number.isFinite(epoch) || !rankInfo || rankInfo.kind === 'scratch') continue;
    const horse = stripCode(raw[6]);
    if (!horse) continue;
    const dist = String(raw[2] || '').trim();
    const distM = parseInt(dist, 10) || 0;
    if (distM < 800) continue;
    const jockey = parseRider4(raw[7]).name;
    const trainer = String(raw[8] || '').trim();
    const weight = parseFloat(raw[9]);
    const gate = parseInt(raw[11], 10);
    const finished = rankInfo.kind === 'finish';
    const rank = finished ? rankInfo.rank : 99;
    const run = {
      date, epoch, raceNo: parseInt(raw[1], 10) || 0,
      raceKey: date + '|' + String(parseInt(raw[1], 10) || raw[1]),
      dist, distM, goingCat: goingCategory2(raw[3]),
      rank, finished, win: rank === 1, place: rank >= 1 && rank <= 3,
      horse, jockey, trainer,
      weight: Number.isFinite(weight) ? weight : 0,
      gate: Number.isInteger(gate) ? gate : 0,
      time: parseTimeSeconds3(raw[12]),
      trip: tripScore4(raw[13]),
      style: styleFromNote4(raw[13]),
      lengths: finished ? null : 16,
      effLen: 16, speed: null, pr: -6, fieldAbility: 0, weakRace: false,
    };
    let race = raceMap.get(run.raceKey);
    if (!race) {
      race = { raceKey: run.raceKey, date, epoch, raceNo: run.raceNo, dist, distM, members: [] };
      raceMap.set(run.raceKey, race);
      races.push(race);
    }
    race.members.push(run);
    pushRun(byHorse, horse, run);
    if (jockey) pushRun(byJockey, jockey, run);
    if (trainer) pushRun(byTrainer, trainer, run);
    if (finished) {
      finishers += 1;
      if (run.win) wins += 1;
      if (run.place) places += 1;
      if (run.time) {
        const dg = dist + '|' + run.goingCat;
        if (!timesDG.has(dg)) timesDG.set(dg, []);
        timesDG.get(dg).push(run.time);
        if (!timesD.has(dist)) timesD.set(dist, []);
        timesD.get(dist).push(run.time);
      }
    }
  }

  races.sort((a, b) => a.date.localeCompare(b.date) || a.raceNo - b.raceNo);
  for (const runs of byHorse.values()) runs.sort((a, b) => a.date.localeCompare(b.date) || a.raceNo - b.raceNo);
  for (const runs of byJockey.values()) runs.sort((a, b) => a.epoch - b.epoch);
  for (const runs of byTrainer.values()) runs.sort((a, b) => a.epoch - b.epoch);

  const drawSum = new Map();
  let lenSum = 0;
  let lenN = 0;
  for (const race of races) {
    let winTime = null;
    const weights = [];
    for (const run of race.members) {
      if (run.rank === 1 && run.time) winTime = winTime === null ? run.time : Math.min(winTime, run.time);
      if (run.weight > 0) weights.push(run.weight);
    }
    race.winTime = winTime;
    race.medW = weights.length ? median2(weights) : 0;
    const distFactor = Math.max(0.85, Math.min(1.75, race.distM / 1400));
    for (const run of race.members) {
      let lengths = 16;
      if (run.finished) {
        if (winTime && run.time && run.time >= winTime - 0.03) {
          const secPerLen = 2.5 * winTime / race.distM;
          lengths = clamp4((run.time - winTime) / secPerLen, 0, 20);
        } else lengths = clamp4((run.rank - 1) * 1.2, 0, 20);
      }
      run.lengths = lengths;
      if (run.finished && run.gate >= 1) {
        const key = distBand4(race.distM) + '|' + gateBucket4(run.gate);
        const stat = drawSum.get(key) || { sum: 0, n: 0 };
        stat.sum += lengths;
        stat.n += 1;
        drawSum.set(key, stat);
        lenSum += lengths;
        lenN += 1;
      }
      const wPen = run.weight > 0 && race.medW > 0 ? (run.weight - race.medW) * A4.LB_PER_LB * distFactor : 0;
      run._wPen = wPen;
      run._distFactor = distFactor;
    }
  }

  const globalMean = lenN ? lenSum / lenN : 4;
  const draw = new Map();
  for (const [key, stat] of drawSum) {
    draw.set(key, { effect: globalMean - stat.sum / stat.n, n: stat.n });
  }

  const parOf = list => {
    if (!list || list.length < 8) return null;
    const sorted = list.slice().sort((a, b) => a - b);
    return sorted[Math.floor(sorted.length / 2)];
  };
  const parDG = new Map();
  const parD = new Map();
  for (const [key, list] of timesDG) {
    const med = parOf(list);
    if (med) parDG.set(key, med);
  }
  for (const [key, list] of timesD) {
    const med = parOf(list);
    if (med) parD.set(key, med);
  }

  for (const race of races) {
    const finishCount = race.members.filter(run => run.finished).length;
    race.weak = finishCount < 3;
    for (const run of race.members) {
      const bucket = run.gate >= 1 ? draw.get(distBand4(race.distM) + '|' + gateBucket4(run.gate)) : null;
      const drawEffect = bucket ? bucket.effect : 0;
      run.effLen = run.lengths - run.trip + run._wPen + drawEffect;
      run.weakRace = race.weak;
      const par = parDG.get(race.dist + '|' + run.goingCat) || parD.get(race.dist);
      if (run.finished && run.time && par) {
        const secPerLen = 2.5 * par / race.distM;
        run.speed = clamp4((par - run.time) / secPerLen + run._wPen - drawEffect, -12, 10);
      }
      if (race.weak) {
        run.pr = run.finished ? clamp4(1.4 - (run.rank - 1) * 0.62, -8, 2.4) : -6;
      }
    }
    roster.set(race.raceKey, race.members.map(member => ({ horse: member.horse, rank: member.rank })));
  }

  const endEpoch = races.reduce((max, race) => Math.max(max, race.epoch), 0) + 86400000;
  let ratings = new Map();
  for (let pass = 0; pass < 3; pass++) {
    for (const race of races) {
      if (race.weak) continue;
      const rated = race.members.filter(run => run.finished);
      if (rated.length < 3) continue;
      let abilitySum = 0;
      for (const run of rated) abilitySum += ratings.get(run.horse) || 0;
      const fieldAbility = abilitySum / rated.length;
      let lenTotal = 0;
      for (const run of rated) lenTotal += run.effLen;
      const avgEff = lenTotal / rated.length;
      for (const run of rated) {
        run.pr = clamp4(fieldAbility + (avgEff - run.effLen), -12, 10);
        run.fieldAbility = fieldAbility;
      }
      for (const run of race.members) {
        if (run.finished) continue;
        run.pr = clamp4(fieldAbility - 7.5, -12, -2);
        run.fieldAbility = fieldAbility;
      }
    }
    ratings = new Map();
    for (const [horse, runs] of byHorse) {
      const stats = decayedMean4(runs, endEpoch, run => run.pr, run => run.weakRace ? 0.45 : 1);
      ratings.set(horse, stats.mean);
    }
  }

  IDX4 = {
    byHorse, byJockey, byTrainer, roster, draw,
    p0Win: finishers ? wins / finishers : 0.08,
    p0Place: finishers ? places / finishers : 0.25,
  };
}

function buildPrediction4(entries, race) {
  if (!IDX4 || !entries || entries.length < 2) return [];
  const asOfDate = String((race && race.date) || (RACECARD && RACECARD.date) || '');
  const asOfEpoch = dateEpoch2(asOfDate);
  const epochCut = Number.isFinite(asOfEpoch) ? asOfEpoch : Infinity;
  const distance = String((race && race.distance) || '');
  const distM = parseInt(distance, 10) || 1200;
  const goingCat = goingCategory2(race && race.going);
  const venue = String((race && race.venue) || (RACECARD && RACECARD.venue) || inferVenue4(distM) || '').toUpperCase();
  const distFactor = Math.max(0.85, Math.min(1.75, distM / 1400));
  const rivals = new Set(entries.map(entry => stripCode(entry.horse_name)).filter(Boolean));

  const carriedOf = entry => {
    const rider = parseRider4(entry.jockey);
    const allocated = parseFloat(entry.weight);
    return {
      rider,
      carried: Number.isFinite(allocated) ? allocated - rider.claim : NaN,
    };
  };
  const carriedWeights = entries.map(entry => carriedOf(entry).carried).filter(weight => Number.isFinite(weight) && weight > 0);
  const fieldMed = carriedWeights.length ? median2(carriedWeights) : 0;
  const riderCache = new Map();
  const trainerCache = new Map();
  const cachedRider = name => {
    if (!name) return { score: 0, n: 0 };
    if (riderCache.has(name)) return riderCache.get(name);
    const score = riderScore4(IDX4.byJockey.get(name), epochCut, IDX4.p0Win, IDX4.p0Place, A4.K_JOCKEY);
    riderCache.set(name, score);
    return score;
  };
  const cachedTrainer = name => {
    if (!name) return { score: 0, n: 0 };
    if (trainerCache.has(name)) return trainerCache.get(name);
    const score = riderScore4(IDX4.byTrainer.get(name), epochCut, IDX4.p0Win, IDX4.p0Place, A4.K_TRAINER);
    trainerCache.set(name, score);
    return score;
  };

  const ctx = entries.map(entry => {
    const horse = stripCode(entry.horse_name);
    const rider = parseRider4(entry.jockey);
    const trainer = String(entry.trainer || '').trim();
    const gate = parseInt(entry.gate, 10) || 0;
    const carried = carriedOf(entry).carried;
    const history = (IDX4.byHorse.get(horse) || []).filter(run => run.epoch < epochCut);
    const margin = decayedMean4(history, epochCut, run => run.pr, run => run.weakRace ? 0.45 : 1);
    const speed = decayedMean4(history, epochCut, run => run.speed, run => run.weakRace ? 0.45 : 1);
    const z = margin.nEff / (margin.nEff + A4.K_HORSE);
    const speedMean = speed.nEff >= 0.8 ? speed.mean : margin.mean;
    const blended = (1 - A4.SPEED_BLEND) * margin.mean + A4.SPEED_BLEND * speedMean;
    const ability = z * blended;
    const raw = blended;
    const exact = history.filter(run => run.dist === distance);
    const near = exact.length >= 2 ? exact : history.filter(run => Math.abs(run.distM - distM) <= 200);
    const distStats = decayedMean4(near, epochCut, run => run.pr, run => (run.weakRace ? 0.45 : 1) * (run.dist === distance ? 1 : 0.62));
    const zD = distStats.nEff / (distStats.nEff + 2.2);
    const distEdge = clamp4(zD * (distStats.mean - margin.mean), -1.4, 1.4);

    let styleW = 0;
    let styleSum = 0;
    let styleN = 0;
    for (const run of history) {
      if (run.style === null) continue;
      const days = Math.max(0, (epochCut - run.epoch) / 86400000);
      const w = Math.exp(-days / 160);
      styleW += w;
      styleSum += run.style * w;
      styleN += 1;
    }
    const style = styleW ? styleSum / styleW : null;
    const last = history.length ? history[history.length - 1] : null;
    const daysSince = last ? Math.max(0, (epochCut - last.epoch) / 86400000) : NaN;
    let freshAdj = 0;
    if (last) {
      if (daysSince < 11) freshAdj = -0.28;
      else if (daysSince <= 24) freshAdj = 0.26;
      else if (daysSince <= 42) freshAdj = 0.12;
      else if (daysSince <= 75) freshAdj = 0.03;
      else if (daysSince <= 130) freshAdj = -0.1;
      else if (daysSince <= 210) freshAdj = -0.28;
      else freshAdj = -0.5;
    }
    const bounce = last && last.trip >= 0.85 && last.rank >= 4 && last.rank <= 11 && daysSince <= 75
      ? Math.min(0.8, last.trip * A4.W_BOUNCE) : 0;
    let trend = 0;
    if (history.length >= 3) {
      const a = history[history.length - 3].pr;
      const b = history[history.length - 1].pr;
      trend = clamp4((b - a) * 0.08, -0.3, 0.32);
    }
    const lastEdge = last ? clamp4((last.pr - blended) * A4.W_LAST, -0.28, 0.32) : 0;
    let formW = 0;
    let formSum = 0;
    const formRuns = history.slice(-6);
    for (let i = 0; i < formRuns.length; i++) {
      const run = formRuns[i];
      if (!run.finished) continue;
      const days = Math.max(0, (epochCut - run.epoch) / 86400000);
      const distW = run.dist === distance ? 1.28 : 1;
      const w = Math.exp(-days / A4.HALF_LIFE) * distW;
      const pt = run.rank === 1 ? 1 : run.rank <= 3 ? 0.66 : run.rank <= 5 ? 0.3 : run.rank <= 7 ? 0.08 : 0;
      formW += w;
      formSum += pt * w;
    }
    const formAdj = formW ? ((formSum / formW) - 0.3) * (A4.W_FORM || 0) : 0;
    let volPenalty = 0;
    if (history.length >= 4) {
      const recent = history.slice(-8);
      const mean = recent.reduce((sum, run) => sum + run.pr, 0) / recent.length;
      const variance = recent.reduce((sum, run) => sum + (run.pr - mean) ** 2, 0) / recent.length;
      volPenalty = Math.min(0.45, Math.sqrt(variance) * 0.045) * (A4.W_VOL || 1);
    }
    let goingAdj = 0;
    if (goingCat && goingCat !== '其他') {
      const goingRuns = history.filter(run => run.goingCat === goingCat);
      if (goingRuns.length >= 2) {
        const gMean = goingRuns.reduce((sum, run) => sum + run.pr, 0) / goingRuns.length;
        goingAdj = clamp4((gMean - margin.mean) * 0.3, -0.35, 0.35);
      }
    }
    let h2h = 0;
    for (let i = Math.max(0, history.length - 10); i < history.length; i++) {
      const run = history[i];
      const field = IDX4.roster.get(run.raceKey);
      if (!field) continue;
      const daysAgo = Math.max(0, (epochCut - run.epoch) / 86400000);
      if (daysAgo > 420) continue;
      for (const other of field) {
        if (other.horse === horse || !rivals.has(other.horse)) continue;
        const beat = run.rank < other.rank ? 1 : run.rank > other.rank ? 0 : 0.5;
        const w = Math.exp(-daysAgo / 200) * (run.dist === distance ? 1 : 0.7);
        h2h += (beat - 0.5) * 0.5 * w;
      }
    }
    h2h = clamp4(h2h, -0.75, 0.75);
    const sameRider = history.filter(run => run.jockey && run.jockey === rider.name);
    let combo = 0;
    if (sameRider.length) {
      const comboWins = sameRider.filter(run => run.win).length;
      if (comboWins >= 1) combo = 0.26 + Math.min(0.22, (comboWins - 1) * 0.07);
      else if (sameRider.length >= 4) combo = -0.16;
    }
    let distChange = 0;
    if (last && style !== null && Math.abs(last.distM - distM) >= 200) {
      const step = distM - last.distM;
      if (step >= 200 && style < -0.25) distChange = 0.24;
      else if (step >= 200 && style > 0.45) distChange = -0.2;
      else if (step <= -200 && style > 0.35) distChange = 0.14;
    }
    const jockeyNow = cachedRider(rider.name);
    const trainerNow = cachedTrainer(trainer);
    const seen = new Set();
    const usualScores = [];
    for (let i = history.length - 1; i >= 0 && usualScores.length < 4; i--) {
      const name = history[i].jockey;
      if (!name || seen.has(name)) continue;
      seen.add(name);
      usualScores.push(cachedRider(name).score);
    }
    const usual = usualScores.length ? usualScores.reduce((sum, value) => sum + value, 0) / usualScores.length : 0;
    const upgrade = history.length ? jockeyNow.score - usual : 0;
    const jHot = clamp4(hotEdge4(IDX4.byJockey.get(rider.name), epochCut, 60, 12) * 4.5, -0.4, 0.42);
    const tHot = clamp4(hotEdge4(IDX4.byTrainer.get(trainer), epochCut, 45, 8) * 4.2, -0.35, 0.38);
    const weightAdj = fieldMed > 0 && Number.isFinite(carried)
      ? (fieldMed - carried) * A4.LB_PER_LB * distFactor : 0;
    const bucket = gate >= 1 ? IDX4.draw.get(distBand4(distM) + '|' + gateBucket4(gate)) : null;
    const zDraw = bucket ? bucket.n / (bucket.n + A4.DRAW_K) : 0;
    const drawAdj = clamp4((zDraw * (bucket ? bucket.effect : 0)) * 0.85 + venueDrawPrior4(venue, distM, gate) * 0.62, -0.7, 0.6);

    return {
      entry, horse, rider, trainer, gate, ability, raw, nEff: margin.nEff, z, style, styleN,
      distEdge, freshAdj, bounce, trend, lastEdge, formAdj, volPenalty, goingAdj, h2h, combo,
      distChange, jockeyNow, trainerNow, upgrade, jHot, tHot, weightAdj, drawAdj, last, daysSince,
    };
  });

  const todayField = ctx.reduce((sum, item) => sum + item.ability, 0) / ctx.length;
  const knownRaw = ctx.filter(item => item.nEff >= 1.2);
  const todayClass = knownRaw.length
    ? knownRaw.reduce((sum, item) => sum + item.raw, 0) / knownRaw.length : 0;
  const knownStyle = ctx.filter(item => item.styleN >= 2 && item.style !== null).length;
  const paceOn = knownStyle >= Math.min(4, Math.ceil(ctx.length * 0.35));
  const frontCount = paceOn ? ctx.filter(item => item.styleN >= 2 && item.style >= 0.5).length : 0;
  const neutralPace = distM >= 1800 ? 1.6 : distM >= 1400 ? 2 : 2.3;

  const scored = ctx.map(item => {
    const styleConf = item.style === null ? 0 : Math.min(1, item.styleN / 4);
    let paceAdj = 0;
    if (paceOn && styleConf > 0) {
      paceAdj = styleConf * (frontCount - neutralPace) * (-0.3 * item.style);
      if (distM <= 1200 && item.gate >= 11 && item.style > 0.4) paceAdj -= 0.32 * styleConf;
