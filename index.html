<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HKJC 賽馬分析 | 下場預測工具</title>
  <style>
    :root {
      --blue:      #003F88;
      --blue-lt:   #0055B3;
      --bg:        #F0F2F5;
      --white:     #FFFFFF;
      --border:    #E0E0E0;
      --t1:        #111111;
      --t2:        #555555;
      --t3:        #888888;
      --gold:      #C8960C;
      --silver:    #9CA3AF;
      --bronze:    #A0522D;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Noto Sans TC', BlinkMacSystemFont,
                   'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--t1);
    }

    /* ── Header ── */
    .hdr {
      background: var(--blue);
      color: #fff;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky; top: 0; z-index: 200;
      box-shadow: 0 2px 8px rgba(0,0,0,.35);
    }
    .hdr-icon  { font-size: 26px; }
    .hdr-title { font-size: 17px; font-weight: 700; letter-spacing: .4px; }
    .hdr-sub   { font-size: 11px; opacity: .7; margin-top: 1px; }
    .hdr-race-day {
      margin-left: 12px; font-size: 12px;
      background: rgba(255,255,255,.18);
      padding: 3px 10px; border-radius: 12px;
    }

    /* ── Loading overlay ── */
    .loading-overlay {
      position: fixed; inset: 0;
      background: rgba(255,255,255,.85);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; z-index: 999;
    }
    .loading-overlay.hidden { display: none; }
    .hidden { display: none !important; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #E5E7EB;
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-txt { font-size: 14px; color: var(--t2); }

    /* ── Error / no-race state ── */
    .fullstate {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: calc(100vh - 50px);
      gap: 10px; color: var(--t3); text-align: center; padding: 20px;
    }
    .fullstate .fi  { font-size: 48px; }
    .fullstate .ft  { font-size: 16px; font-weight: 600; color: var(--t2); }
    .fullstate .fs  { font-size: 13px; }
    .fullstate .retry-btn {
      margin-top: 8px;
      padding: 8px 20px;
      background: var(--blue); color: #fff;
      border: none; border-radius: 6px;
      font-size: 13px; cursor: pointer;
    }
    .fullstate .retry-btn:hover { background: var(--blue-lt); }

    /* ── Layout ── */
    .layout {
      display: flex;
      height: calc(100vh - 50px);
    }

    /* ── Race list panel ── */
    .race-panel {
      width: 300px; min-width: 260px;
      background: var(--white);
      overflow-y: auto;
      border-right: 2px solid var(--border);
      flex-shrink: 0;
    }
    .panel-hdr {
      padding: 10px 14px;
      background: #F8F8F8;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .panel-hdr-title {
      font-size: 12px; font-weight: 600;
      color: var(--blue); text-transform: uppercase;
      letter-spacing: .5px; margin-bottom: 4px;
    }
    .panel-hdr-date {
      font-size: 14px; font-weight: 700; color: var(--t1);
      margin-bottom: 4px;
    }
    .panel-hdr-badge {
      display: inline-block;
      background: #E8F5E9; color: #1B5E20;
      font-size: 11px; font-weight: 700;
      padding: 2px 7px; border-radius: 10px;
    }

    /* Race item */
    .race-item {
      display: flex; align-items: flex-start;
      padding: 13px 14px;
      border-bottom: 1px solid #F0F0F0;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background .12s;
    }
    .race-item:hover  { background: #F0F4FF; }
    .race-item.active { background: #E8EFFF; border-left-color: var(--blue); }
    .race-num {
      width: 42px; height: 42px;
      background: #E5E7EB; color: #444;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; font-weight: 700;
      flex-shrink: 0; margin-right: 12px; margin-top: 2px;
      transition: background .12s, color .12s;
    }
    .race-item.active .race-num { background: var(--blue); color: #fff; }
    .race-info { flex: 1; min-width: 0; }
    .race-meta { font-size: 11px; color: var(--t3); margin-bottom: 2px; }
    .race-dist { font-size: 21px; font-weight: 700; line-height: 1.2; }
    .race-going { font-size: 12px; color: var(--t2); margin-top: 3px; }
    .race-chevron { align-self: center; color: #CCC; font-size: 16px; margin-left: 6px; }

    /* ── Detail panel ── */
    .detail-panel {
      flex: 1; overflow-y: auto;
      background: var(--bg); min-width: 0;
    }
    .empty-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 55%; gap: 8px;
      color: #BBB; text-align: center;
    }
    .empty-state .ei   { font-size: 48px; }
    .empty-state .etxt { font-size: 16px; }
    .empty-state .esub { font-size: 12px; color: #CCC; }

    /* Race detail header */
    .detail-hdr {
      background: var(--white);
      padding: 13px 16px;
      border-bottom: 2px solid var(--blue);
      position: sticky; top: 0; z-index: 10;
    }
    .detail-label { font-size: 11px; color: var(--t3); margin-bottom: 2px; }
    .detail-title {
      font-size: 17px; font-weight: 700; color: var(--blue);
      margin-bottom: 4px;
    }
    .detail-meta { font-size: 13px; color: var(--t2); }

    /* Card legend row */
    .card-legend {
      display: flex; align-items: flex-start;
      padding: 5px 16px 7px;
      background: #FAFAFA; border-bottom: 1px solid var(--border);
    }
    .cl-left  { flex: 1; font-size: 10px; font-weight: 700; color: var(--t3);
                text-transform: uppercase; letter-spacing: .4px; padding-top: 4px; }
    .cl-right { display: flex; flex-direction: column; gap: 3px;
                min-width: 155px; align-items: flex-end; }
    .cl-right span { font-size: 9px; color: var(--t3); font-weight: 600; letter-spacing: .3px; }

    /* ── Horse card ── */
    .horse-card {
      display: flex; align-items: center;
      background: var(--white);
      margin: 5px 8px;
      border-radius: 8px;
      padding: 11px 14px;
      box-shadow: 0 1px 3px rgba(0,0,0,.07);
      border-left: 4px solid #E5E7EB;
      transition: box-shadow .12s;
    }
    .horse-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,.12); }

    .horse-num {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 15px; font-weight: 700; color: var(--t2);
      width: 44px; flex-shrink: 0; margin-right: 10px;
    }
    .silk-wrap {
      width: 38px; height: 38px; overflow: hidden;
      border-radius: 4px; border: 1px solid #E0E0E0;
      background: #F8F8F8;
      display: flex; align-items: center; justify-content: center;
    }
    .silk-img  { width: 38px; height: auto; display: block; }
    .horse-gw {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 52px; flex-shrink: 0; margin: 0 10px; gap: 3px;
    }
    .hg-num    { font-size: 22px; font-weight: 800; color: var(--blue); line-height: 1; }
    .hg-weight { font-size: 11px; font-weight: 600; color: var(--t3); white-space: nowrap; }
    .horse-rec {
      display: flex; align-items: center; justify-content: center;
      width: 60px; flex-shrink: 0; margin: 0 8px;
    }
    .cl-rec {
      font-size: 10px; font-weight: 700; color: var(--t3);
      text-transform: uppercase; letter-spacing: .4px;
      width: 60px; margin: 0 8px; flex-shrink: 0;
      text-align: center; padding-top: 4px;
    }
    .horse-trj {
      display: flex; align-items: center; justify-content: center;
      width: 64px; flex-shrink: 0; margin: 0 8px;
    }
    .cl-trj {
      font-size: 10px; font-weight: 700; color: var(--t3);
      text-transform: uppercase; letter-spacing: .4px;
      width: 64px; margin: 0 8px; flex-shrink: 0;
      text-align: center; padding-top: 4px;
    }
    .cl-gw {
      font-size: 10px; font-weight: 700; color: var(--t3);
      text-transform: uppercase; letter-spacing: .4px;
      width: 52px; margin: 0 10px; flex-shrink: 0;
      text-align: center; padding-top: 4px;
    }
    .horse-left  { flex: 1; min-width: 0; }
    .h-name {
      font-size: 19px; font-weight: 700; color: var(--t1);
      margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .h-jockey  { font-size: 13px; color: var(--t2); margin-bottom: 2px; }
    .h-trainer { font-size: 12px; color: var(--t3); }
    .h-label   { font-size: 11px; color: var(--t3); margin-right: 4px; }

    .horse-right {
      display: flex; flex-direction: column;
      align-items: flex-end; gap: 5px;
      margin-left: 12px; flex-shrink: 0; min-width: 110px;
    }
    .hr-row2 { display: flex; justify-content: flex-end; }
    .hr-row3 { display: flex; justify-content: flex-end; }
    .form-chips { display: inline-flex; gap: 3px; align-items: center; flex-wrap: nowrap; }
    .fchip {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 22px; height: 22px; padding: 0 4px;
      border-radius: 11px; font-size: 11px; font-weight: 700;
    }
    .fc-1    { background: var(--gold);   color: #fff; }
    .fc-top  { background: var(--silver); color: #fff; }
    .fc-mid  { background: #D1FAE5; color: #065F46; }
    .fc-tail { background: #F3F4F6; color: #6B7280; }
    .fc-pu   { background: #FEE2E2; color: #991B1B; }
    .no-form { font-size: 13px; color: #CBD5E1; }
    .weight-val  { font-size: 14px; font-weight: 600; white-space: nowrap; }
    .weight-unit { font-size: 11px; color: var(--t3); }
    .badge {
      display: inline-flex; align-items: center;
      font-size: 11px; font-weight: 700;
      padding: 3px 8px; border-radius: 12px;
      white-space: nowrap; line-height: 1.4;
    }
    .rec-win { background: #FEE2E2; color: #991B1B; }
    .rec-nw  { background: #EFF6FF; color: #1E40AF; }
    .rec-1st { background: #F0FDF4; color: #14532D; }
    .tri-row { display: inline-flex; gap: 3px; align-items: center; }
    .tri     { font-size: 15px; color: #CBD5E1; line-height: 1; }
    .tri-on  { color: #16A34A; }
    .trj-h   { background: #FFF7ED; color: #9A3412; }
    .trj-m   { background: #F0FDF4; color: #14532D; }
    .trj-l   { background: #F1F5F9; color: #475569; }

    /* ── Prediction box ── */
    .pred-box {
      background: linear-gradient(135deg, #EEF2FF, #fff);
      border-radius: 10px; margin: 8px;
      padding: 12px 14px; border: 1.5px solid #C7D2FE;
    }
    .pred-title  { font-size: 13px; font-weight: 700; color: var(--blue); margin-bottom: 8px; }
    .pred-panel > .pred-title {
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; list-style: none;
    }
    .pred-panel > .pred-title::-webkit-details-marker { display: none; }
    .pred-panel > .pred-title::marker { content: ''; }
    .pred-panel > .pred-title::before {
      content: ''; width: 0; height: 0; flex-shrink: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid currentColor;
      transition: transform .15s;
    }
    .pred-panel:not([open]) > .pred-title { margin-bottom: 0; }
    .pred-panel:not([open]) > .pred-title::before { transform: rotate(-90deg); }
    .pred-heading-label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .pred-order {
      display: none; margin-left: auto; white-space: nowrap;
      color: var(--blue); font-size: 13px; font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .pred-panel:not([open]) .pred-order { display: inline-flex; }
    .pred-grid   { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
    .pred-slot   {
      padding: 9px 10px; background: #fff;
      border-radius: 7px; border: 1px solid #E0E8FF;
      box-shadow: 0 1px 3px rgba(0,63,136,.07);
    }
    .pred-rank   { font-size: 12px; margin-bottom: 3px; }
    .pred-horse  {
      font-size: 12px; font-weight: 700; color: var(--blue);
      margin-bottom: 6px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .pred-bar-wrap { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .pred-bar-bg   { flex: 1; height: 7px; background: #E5E7EB; border-radius: 4px; overflow: hidden; }
    .pred-bar      { height: 100%; border-radius: 4px; }
    .pred-s1 .pred-bar { background: var(--gold); }
    .pred-s2 .pred-bar { background: var(--silver); }
    .pred-s3 .pred-bar { background: var(--bronze); }
    .pred-s4 .pred-bar { background: #6B7280; }
    .pred-pct    { font-size: 11px; font-weight: 700; min-width: 28px; text-align: right; }
    .pred-s1 .pred-pct { color: #92660C; }
    .pred-s2 .pred-pct { color: #6B7280; }
    .pred-s3 .pred-pct { color: var(--bronze); }
    .pred-s4 .pred-pct { color: #6B7280; }
    .pred-reason { font-size: 10px; color: var(--t3); line-height: 1.4; }

    .pred-actual { font-size: 10px; color: #047857; font-weight: 700; line-height: 1.4; }

    /* ── Prediction model: GLM 5.3 洞燭先機 ── */
    .pred-box-glm {
      background: linear-gradient(135deg, #F5F3FF, #fff 58%);
      border-color: #C4B5FD;
    }
    .pred-box-glm .pred-title,
    .pred-box-glm .pred-order,
    .pred-box-glm .pred-horse { color: #5B21B6; }
    .pred-box-glm .pred-slot {
      border-color: #EDE9FE;
      box-shadow: 0 1px 3px rgba(91, 33, 182, 0.06);
    }
    .pred-box-glm .pred-insight {
      font-size: 11px; line-height: 1.5; color: #5B21B6;
      background: rgba(245, 243, 255, 0.95);
      border: 1px dashed #C4B5FD; border-radius: 6px;
      padding: 6px 8px; margin: 0 0 8px;
    }
    .pred-glm-badge {
      display: inline-block; font-size: 9px; font-weight: 700;
      background: #7C3AED; color: #fff; border-radius: 6px;
      padding: 0 5px; margin-left: 4px; vertical-align: 1px;
    }

    /* ── Race strip (mobile selector) ── */
    .race-strip {
      display: none;
      gap: 10px;
      padding: 10px 14px;
      background: var(--white);
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 50px;
      z-index: 100;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
    }
    .race-strip::-webkit-scrollbar { display: none; }
    .race-bubble {
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      cursor: pointer; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .rb-circle {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: #E8EFFF; color: var(--blue);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800;
      transition: background .15s, color .15s, transform .12s;
    }
    .race-bubble.active .rb-circle {
      background: var(--blue); color: #fff;
      transform: scale(1.08);
      box-shadow: 0 3px 8px rgba(0,63,136,.35);
    }


    /* ── Horse mobile stats row ── */
    .horse-meta-row {
      display: none;
      width: 100%;
      flex-wrap: wrap;
      gap: 5px;
      padding-top: 7px;
      margin-top: 4px;
      border-top: 1px solid #F0F0F0;
      align-items: center;
    }
    .hm-gate {
      font-size: 12px; font-weight: 700;
      color: var(--blue);
      background: #E8EFFF;
      padding: 2px 8px; border-radius: 10px;
    }
    .hm-weight { font-size: 12px; font-weight: 600; color: var(--t2); }

    /* ── Responsive ── */
    @media (max-width: 679px) {
      .layout { flex-direction: column; height: auto; }
      .race-panel { display: none; }
      .race-strip { display: flex; }
      .detail-panel {
        overflow: visible;
        min-height: calc(100vh - 168px);
      }
      .hdr { padding: 8px 14px; }
      .hdr-sub { display: none; }
      .hdr-title { font-size: 15px; }
      .hdr-race-day { font-size: 11px; margin-left: auto; }
      .horse-card {
        margin: 4px 6px; padding: 10px 12px;
        flex-wrap: wrap;
      }
      .horse-gw, .horse-rec, .horse-trj { display: none; }
      .horse-right { display: none; }
      .horse-meta-row { display: flex; }
      .h-name { font-size: 16px; }
      .card-legend { display: none; }
      .pred-grid { grid-template-columns: repeat(2,1fr); }
      .detail-title { font-size: 15px; }
      .detail-hdr { padding: 10px 12px; }
      .pred-box { margin: 6px; }
    }
  </style>
</head>
<body>

<!-- ── Loading overlay ────────────────────────────── -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-txt">載入賽事資料中…</div>
</div>

<!-- ── Header ─────────────────────────────────────── -->
<header class="hdr">
  <span class="hdr-icon">🏇</span>
  <div>
    <div class="hdr-title">HKJC 賽馬分析</div>
    <div class="hdr-sub">下場預測 · 馬匹分析工具</div>
  </div>
  <span class="hdr-race-day" id="hdrDate">—</span>
</header>

<!-- ── Full-page state (no race / error) ──────────── -->
<div class="fullstate hidden" id="fullstate">
  <div class="fi" id="fullstateIcon">📅</div>
  <div class="ft" id="fullstateTitle">今日沒有本地賽事</div>
  <div class="fs" id="fullstateMsg">請於下個賽事日再開啟此頁面。</div>
  <button class="retry-btn hidden" id="retryBtn" onclick="loadData()">重試</button>
</div>

<!-- ── Mobile Race Strip ─────────────────────────── -->
<div class="race-strip hidden" id="raceStrip"></div>

<!-- ── Main Layout ────────────────────────────────── -->
<div class="layout hidden" id="mainLayout">

  <!-- Left: Race list -->
  <nav class="race-panel" id="racePanel">
    <div class="panel-hdr">
      <div class="panel-hdr-title">本地賽事 · 下場分析</div>
      <div class="panel-hdr-date" id="panelDate">—</div>
      <div class="panel-hdr-badge">最新賽事卡</div>
    </div>
    <div id="raceList"></div>
  </nav>

  <!-- Right: Detail -->
  <main class="detail-panel" id="detailPanel">
    <div class="empty-state" id="emptyState" hidden></div>
    <div id="detailContent" hidden></div>
  </main>

</div><!-- /layout -->

<script>
'use strict';

/* ── Config ──────────────────────────────────────── */
const SCRAPER_RAW = 'https://raw.githubusercontent.com/mzf3334-dev/hkjc_scraper/main';

/* ── State ───────────────────────────────────────── */
let D        = [];       // all historical rows parsed from all_results.csv
let RACECARD = null;     // today's racecard_today.json
let activeRace = null;   // currently selected race_no string

/* ── DOM refs ─────────────────────────────────────── */
const $overlay      = document.getElementById('loadingOverlay');
const $fullstate    = document.getElementById('fullstate');
const $mainLayout   = document.getElementById('mainLayout');
const $raceList     = document.getElementById('raceList');
const $emptyState   = document.getElementById('emptyState');
const $detailContent= document.getElementById('detailContent');
const $panelDate    = document.getElementById('panelDate');
const $hdrDate      = document.getElementById('hdrDate');
const $retryBtn     = document.getElementById('retryBtn');
const $raceStrip    = document.getElementById('raceStrip');

/* ── Helpers ─────────────────────────────────────── */
function stripCode(name) {
  return (name || '').replace(/\([^)]+\)\s*$/, '').trim();
}

function isValidRaceEntry(entry) {
  if (!entry) return false;
  const horseNo = String(entry.horse_no || '').trim();
  const horseName = String(entry.horse_name || '').trim();
  const jockey = String(entry.jockey || '').trim();
  const trainer = String(entry.trainer || '').trim();

  // Ignore placeholder rows such as "S1 日本:" and incomplete entries.
  if (!/^\d+$/.test(horseNo)) return false;
  if (!horseName || !jockey || !trainer) return false;
  return true;
}

function normalizeRacecardData(rawRacecard) {
  const races = Array.isArray(rawRacecard?.races) ? rawRacecard.races : [];
  const normalizedRaces = races
    .map(r => ({
      ...r,
      entries: (r.entries || []).filter(isValidRaceEntry),
    }))
    .filter(r => (r.entries || []).length > 0);

  return {
    ...rawRacecard,
    races: normalizedRaces,
  };
}

function buildPreviousRaceDemo(rows) {
  const nonFinishers = new Set(['PU', 'DNF', 'UR', 'FE']);
  const races = new Map();
  for (const row of rows) {
    const date = String(row[0] || '').trim();
    const raceNo = parseInt(row[1], 10);
    const position = String(row[4] || '').trim();
    const parsedPosition = parseInt(position, 10);
    if (!date || !Number.isInteger(raceNo) ||
        (!(Number.isInteger(parsedPosition) && parsedPosition > 0) && !nonFinishers.has(position.toUpperCase()))) continue;
    const key = `${date}|${raceNo}`;
    if (!races.has(key)) races.set(key, { date, raceNo, rows: [] });
    races.get(key).rows.push(row);
  }

  const latestDate = [...races.values()].map(race => race.date).sort().at(-1);
  if (!latestDate) throw new Error('歷史賽果中找不到可預覽的已完成賽事。');
  const demoRaces = [...races.values()]
    .filter(race => race.date === latestDate)
    .sort((a, b) => a.raceNo - b.raceNo)
    .map(race => ({
      race_no: String(race.raceNo),
      distance: String(race.rows[0][2] || '').trim(),
      going: String(race.rows[0][3] || '').trim(),
      entries: race.rows.map(row => {
        const rider = String(row[7] || '').trim();
        const claimMatch = rider.match(/[（(]\s*-\s*(\d+)\s*[）)]/);
        const claim = claimMatch ? Math.min(10, parseInt(claimMatch[1], 10) || 0) : 0;
        const carried = parseFloat(row[9]);
        return {
          horse_no: String(row[5] || '').trim(),
          horse_name: String(row[6] || '').trim(),
          jockey: rider,
          trainer: String(row[8] || '').trim(),
          // Reconstruct the allocated handicap weight: actual carried + apprentice claim.
          weight: Number.isFinite(carried) ? String(carried + claim) : String(row[9] || '').trim(),
          gate: String(row[11] || '').trim(),
          actual_rank: String(row[4] || '').trim(),
        };
      }).filter(isValidRaceEntry),
    }))
    .filter(race => race.entries.length >= 2);
  if (!demoRaces.length) throw new Error('最近賽馬日沒有足夠有效排位可供預覽。');

  return {
    history: rows.filter(row => String(row[0] || '').trim() < latestDate),
    racecard: {
      date: latestDate,
      demo: true,
      races: demoRaces,
    },
  };
}

function actualRankLabel2(entry) {
  const result = String((entry && entry.actual_rank) || '').trim();
  const rank = parseInt(result, 10);
  if (Number.isInteger(rank) && rank > 0) {
    return `實際第${rank}名${result.includes('平頭馬') ? '（平頭）' : ''}`;
  }
  return result ? `實際 ${result}` : '實際未有名次';
}

function horseCode(name) {
  const m = (name || '').match(/\(([^)]+)\)\s*$/);
  return m ? m[1] : '';
}

/* ── CSV parser ───────────────────────────────────── */
function parseCSV(text) {
  const lines = text.trim().split('\n');
  // Skip BOM + header, return array of arrays (same shape as prototype D)
  return lines.slice(1).map(l => {
    // Split on comma but respect quoted fields
    const cols = [];
    let cur = '', inQ = false;
    for (const ch of l) {
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur);
    return cols;
  }).filter(r => r.length >= 14);
}

/* ── Analytics (identical logic to prototype) ─────── */
function detectPos(incident, gate) {
  const t = incident || '';
  const isFront = ['領放', '居前列', '前列位置', '在領放馬'].some(k => t.includes(k));
  const isBack  = ['在馬群之後', '馬群後列', '後列', '居後', '在後', '馬群之後切入']
                    .some(k => t.includes(k));
  if (isFront && !isBack) return '前';
  if (isBack  && !isFront) return '後';
  if (isFront && isBack)   return '中';
  const g = parseInt(gate) || 7;
  if (g <= 4) return '前';
  if (g <= 8) return '中';
  return '後';
}

function typicalPos(horseName) {
  const rows = D.filter(r => stripCode(r[6]) === horseName);
  if (!rows.length) return '不明';
  const cnt = {};
  for (const r of rows) {
    const p = detectPos(r[13], r[11]);
    cnt[p] = (cnt[p] || 0) + 1;
  }
  return Object.entries(cnt).sort((a, b) => b[1] - a[1])[0][0];
}

function jockeyRecord(horseName, jockey) {
  const rows = D.filter(r => stripCode(r[6]) === horseName && r[7] === jockey);
  if (!rows.length) return { wins: 0, total: 0, label: '首次', hasWin: false };
  const wins  = rows.filter(r => r[4] === '1').length;
  const total = rows.length;
  return { wins, total, label: `${wins}勝/${total}場`, hasWin: wins > 0 };
}

function posTri(pos) {
  const active = pos === '前' ? 0 : pos === '後' ? 4 : pos === '中' ? 2 : -1;
  return '<span class="tri-row">' +
    [0,1,2,3,4].map(i => {
      const on = i === active;
      return `<span class="tri${on ? ' tri-on' : ''}">${on ? '\u25C0' : '\u25C1'}</span>`;
    }).join('') + '</span>';
}

function trainerJockeyWinPct(trainer, jockey) {
  const rows = D.filter(r => r[8] === trainer && r[7] === jockey);
  if (!rows.length) return { label: '師騎首次', cls: 'rec-1st' };
  const wins = rows.filter(r => r[4] === '1').length;
  const pct  = Math.round(wins / rows.length * 100);
  const cls  = pct >= 40 ? 'trj-h' : pct >= 20 ? 'trj-m' : 'trj-l';
  return { label: `師騎 ${pct}%`, cls };
}

function sameDistChips(horseName, dist) {
  const res = D
    .filter(r => stripCode(r[6]) === horseName && r[2] === dist)
    .sort((a, b) => b[0].localeCompare(a[0]))
    .slice(0, 4).map(r => r[4]);
  if (!res.length) return '<span class="no-form">—</span>';
  return res.map(rank => {
    const rk  = parseInt(rank) || 0;
    const cls = rank === 'PU' ? 'fc-pu'
              : rk === 1     ? 'fc-1'
              : rk <= 3      ? 'fc-top'
              : rk <= 6      ? 'fc-mid' : 'fc-tail';
    return `<span class="fchip ${cls}">${rank}</span>`;
  }).join('');
}

function buildPrediction(entries, dist) {
  const distNum = parseInt(dist) || 1200;
  // Convert racecard entries to D-format rows for scoring
  const rows = entries.map(e => [
    RACECARD.date, '', dist, '', '', e.horse_no, e.horse_name,
    e.jockey, e.trainer, e.weight, '', e.gate, '', ''
  ]);
  const scored = rows.map(r => {
    const horse   = stripCode(r[6]);
    const jockey  = r[7];
    const trainer = r[8];
    const gate    = parseInt(r[11]) || 8;
    let   score   = 0;
    const reasons = [];

    const recent = D.filter(x => stripCode(x[6]) === horse)
      .sort((a, b) => b[0].localeCompare(a[0])).slice(0, 5);
    if (recent.length) {
      const avg = recent.reduce((s, x) =>
        s + (x[4] === 'PU' ? 14 : (parseInt(x[4]) || 10)), 0) / recent.length;
      const pts = Math.max(0, 30 - avg * 2.5);
      score += pts;
      if (pts >= 18) reasons.push('近仗優秀');
    }

    const dRec = D.filter(x => stripCode(x[6]) === horse && x[2] === dist)
      .sort((a, b) => b[0].localeCompare(a[0])).slice(0, 4);
    if (dRec.length) {
      const avg = dRec.reduce((s, x) =>
        s + (x[4] === 'PU' ? 14 : (parseInt(x[4]) || 10)), 0) / dRec.length;
      const pts = Math.max(0, 25 - avg * 2);
      score += pts;
      if (pts >= 15) reasons.push('同程成績佳');
    }

    const jRaces = D.filter(x => x[7] === jockey);
    if (jRaces.length) {
      const rate = jRaces.filter(x => x[4] === '1').length / jRaces.length;
      score += rate * 20;
      if (rate >= 0.15) reasons.push('騎師勝率高');
    }

    const tjRaces = D.filter(x => x[7] === jockey && x[8] === trainer);
    if (tjRaces.length) {
      const rate = tjRaces.filter(x => x[4] === '1').length / tjRaces.length;
      score += rate * 15;
      if (rate >= 0.20) reasons.push('師騎配合佳');
    }

    if (distNum <= 1400 && gate <= 4) { score += 8; reasons.push('內檔有利'); }

    return { entry: entries.find(e => e.horse_no === r[5]), horse, score, reasons: reasons.slice(0, 2) };
  });
  return scored.sort((a, b) => b.score - a.score);
}

/* ═══ GLM 5.3 洞燭先機 — model core start ═══ */
/* 洞燭：在線 Elo 式評分逐仗更新——每仗只憑賽前資訊回推表現，絕無未來洩漏；
   完成時間先換算為「落後頭馬長度」，扣除負磅、檔位偏差與受阻影響，
   再按對手賽前評分回推該仗表現，更新馬匹實力評分。
   先機：每駒 21 項特徵（實力、同程、近態、趨勢、穩定、復出、負磅、檔位、
   騎練質素與近態、人馬合拍、換騎、對頭馬、場地、步速、級數、速度指數等）
   經全局標準化後線性組合；權重以條件 Plackett-Luce 勝出對數似然配 L2 正則、
   在走步回測上離線梯度學習而得（tools/train_glm.js 直接抽取本段訓練，
   特徵計算與訓練時完全一致），輸出勝出與入位機率，預測頭四名。 */
const GLM = {
  // Trained offline on 941 walk-forward races from all_results.csv (tools/train_glm.js).
  // Validation: 189 later races, top-1 27.5%, top-4 63.0% (random: 8.2% / 32.6%).
  // Mean validation probability assigned to a winner: 13.5%.
  BETA: [0.2100, 0.0515, 0.2471, 0.1792, -0.0243, 0.0598, 0.0331, 0.0358, 0.1351, 0.2064, 0.0209, 0.0160, 0.0560, -0.0000, 0.0152, 0.0626, 0.0361, 0.0623, -0.0218, 0.1018, 0.0890],
  MEAN: [0.1459, 0.0261, 0.2625, 0.0084, 0.0224, 3.7237, 0.0293, -0.0097, 0.0258, 0.0207, -0.0005, 0.0284, 0.0043, -0.0069, -0.0018, -0.0008, -0.0107, -0.0063, 0.0864, 0.0115, 0.2146],
  STD:  [0.7301, 0.1237, 0.2173, 0.0881, 0.0260, 1.1078, 0.0979, 0.6274, 0.4080, 0.4712, 0.2552, 0.1026, 0.4362, 0.1214, 0.1311, 0.3282, 0.1042, 0.0452, 0.2305, 3.3112, 0.4105],
  LABELS: [
    '實力評分', '同程優勢', '近仗入位', '狀態趨勢', '發揮波動',
    '復出週期', '上仗受阻', '負磅輕盈', '檔位有利', '騎師質素',
    '練馬師質素', '人馬合拍', '換騎升級', '騎師手熱', '練馬師熱',
    '對頭馬佔優', '場地合拍', '步速對路', '對手轉弱', '速度指數',
    '內檔短途',
  ],
};
let GLM_IDX = null;

function glmStrip(name) {
  return String(name || '').replace(/\([^)]+\)\s*$/, '').trim();
}

function glmEpoch(date) {
  const m = String(date || '').match(/^(\d{4})\/(\d{2})\/(\d{2})$/);
  return m ? Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : NaN;
}

function glmMedian(list) {
  const sorted = [...list].filter(Number.isFinite).sort((a, b) => a - b);
  if (!sorted.length) return 0;
  const mid = sorted.length >> 1;
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

function glmClamp(value, lo, hi) {
  return Number.isFinite(value) ? Math.max(lo, Math.min(hi, value)) : 0;
}

function glmParseTime(text) {
  const m = String(text || '').trim().match(/^(\d+):(\d+\.?\d*)$/);
  if (!m) return null;
  const sec = parseInt(m[1], 10) * 60 + parseFloat(m[2]);
  return Number.isFinite(sec) && sec > 30 && sec < 250 ? sec : null;
}

function glmParseRank(text) {
  const raw = String(text || '').trim();
  if (!raw || raw === '---') return null;
  const upper = raw.toUpperCase();
  if (upper.startsWith('WV') || upper.startsWith('TNP') || upper === 'SCR') return { kind: 'scratch' };
  const rank = parseInt(raw, 10);
  if (Number.isInteger(rank) && rank > 0) return { kind: 'finish', rank };
  if (/PU|UR|DNF|FE|DISQ|BD|RO/.test(upper)) return { kind: 'dnf' };
  return null;
}

function glmParseRider(raw) {
  const text = String(raw || '').trim();
  const m = text.match(/[（(]\s*-\s*(\d+)\s*[）)]/);
  const claim = m ? Math.min(10, parseInt(m[1], 10) || 0) : 0;
  const name = text.replace(/\s*[（(]\s*-\s*\d+\s*[）)]\s*/g, '').replace(/---/g, '').trim();
  return { name, claim };
}

function glmGoingCat(value) {
  const going = String(value || '').trim();
  if (going === '好地至快地') return '快';
  if (going === '好地') return '好';
  if (going === '好地至黏地' || going === '黏地') return '黏';
  if (going === '軟地' || going === '濕快地' || going === '濕慢地') return '軟';
  if (going === '封地') return '封';
  return '其他';
}

function glmDistBand(distM) {
  if (distM <= 1000) return '1000';
  if (distM <= 1200) return '1200';
  if (distM <= 1400) return '1400';
  if (distM <= 1650) return '1650';
  if (distM <= 1800) return '1800';
  if (distM <= 2000) return '2000';
  return '2200+';
}

function glmGateBucket(gate) {
  if (gate <= 3) return '1-3';
  if (gate <= 6) return '4-6';
  if (gate <= 9) return '7-9';
  if (gate <= 12) return '10-12';
  return '13+';
}

function glmTripScore(note) {
  const text = String(note || '');
  let bonus = 0;
  if (/受阻|受困|未能望空|無路可上|受擠|勒避|被困/.test(text)) bonus += 1.05;
  if (/走外疊|大外疊|走三疊|沒有遮擋/.test(text)) bonus += 0.55;
  if (/出閘緩慢|出閘笨拙|起步慢|起步緩慢|出閘不佳/.test(text)) bonus += 0.3;
  else if (/出閘僅屬一般/.test(text)) bonus += 0.18;
  if (/失蹄|失去平衡|大力碰撞/.test(text)) bonus += 0.28;
  if (/包尾大敗/.test(text)) bonus -= 0.35;
  return glmClamp(bonus, -0.4, 2);
}

function glmStyleOf(note) {
  const text = String(note || '');
  const front = /領放|居前列|前列位置|在領放馬|帶頭/.test(text);
  const back = /在馬群之後|馬群後列|後列|居後|在後|包尾/.test(text);
  if (front && !back) return 1;
  if (back && !front) return -1;
  if (front && back) return 0;
  return null;
}

function glmVenueOf(distM) {
  if (distM === 1650) return 'HV';
  if (distM === 1400 || distM === 1600 || distM === 2000 || distM === 2400) return 'ST';
  return '';
}

function glmVenueDrawPrior(venue, distM, gate) {
  const code = String(venue || '').toUpperCase();
  if (!code || gate <= 0) return 0;
  if (code === 'ST' || code === 'S') {
    if (distM <= 1000) {
      if (gate <= 4) return 0.3;
      if (gate <= 7) return 0.06;
      if (gate >= 12) return -0.36;
      if (gate >= 9) return -0.14;
    } else if (distM <= 1200) {
      if (gate <= 3) return 0.24;
      if (gate <= 6) return 0.07;
      if (gate >= 12) return -0.32;
      if (gate >= 9) return -0.12;
    } else if (distM <= 1400) {
      if (gate <= 3) return 0.1;
      if (gate >= 12) return -0.14;
    } else if (gate <= 4) return 0.04;
    else if (gate >= 12) return -0.05;
  }
  if (code === 'HV' || code === 'H') {
    if (distM <= 1200) {
      if (gate <= 3) return 0.16;
      if (gate >= 11) return -0.26;
    } else if (gate >= 11) return -0.08;
  }
  return 0;
}

function glmDecayedMean(items, asOfEpoch, valueOf, weightOf) {
  let wSum = 0;
  let vSum = 0;
  for (const item of items) {
    if (!(item.epoch < asOfEpoch)) continue;
    const value = valueOf(item);
    if (!Number.isFinite(value)) continue;
    const days = Math.max(0, (asOfEpoch - item.epoch) / 86400000);
    const w = Math.exp(-days / 150) * (weightOf ? weightOf(item) : 1);
    wSum += w;
    vSum += value * w;
  }
  return { mean: wSum ? vSum / wSum : 0, nEff: wSum };
}

function buildGlmIndexes() {
  GLM_IDX = null;
  const raceMap = new Map();
  const races = [];
  for (const raw of D) {
    const date = String(raw[0] || '').trim();
    const epoch = glmEpoch(date);
    const rankInfo = glmParseRank(raw[4]);
    if (!date || !Number.isFinite(epoch) || !rankInfo || rankInfo.kind === 'scratch') continue;
    const horse = glmStrip(raw[6]);
    if (!horse) continue;
    const dist = String(raw[2] || '').trim();
    const distM = parseInt(dist, 10) || 0;
    if (distM < 800) continue;
    const rider = glmParseRider(raw[7]);
    const run = {
      date, epoch, raceNo: parseInt(raw[1], 10) || 0,
      raceKey: date + '|' + (parseInt(raw[1], 10) || raw[1]),
      dist, distM, going: glmGoingCat(raw[3]),
      rank: rankInfo.kind === 'finish' ? rankInfo.rank : 99,
      finished: rankInfo.kind === 'finish',
      win: rankInfo.kind === 'finish' && rankInfo.rank === 1,
      place: rankInfo.kind === 'finish' && rankInfo.rank <= 3,
      horse,
      jockey: rider.name,
      trainer: String(raw[8] || '').trim(),
      weight: parseFloat(raw[9]) || 0,
      gate: parseInt(raw[11], 10) || 0,
      time: glmParseTime(raw[12]),
      trip: glmTripScore(raw[13]),
      style: glmStyleOf(raw[13]),
    };
    let race = raceMap.get(run.raceKey);
    if (!race) {
      race = {
        raceKey: run.raceKey, date, epoch, raceNo: run.raceNo,
        dist, distM, goingRaw: String(raw[3] || '').trim(), members: [],
      };
      raceMap.set(run.raceKey, race);
      races.push(race);
    }
    race.members.push(run);
  }
  races.sort((a, b) => a.date.localeCompare(b.date) || a.raceNo - b.raceNo);

  /* Online pass — ratings, par times and draw baselines are built strictly
     from races already run, so every stored number is walk-forward safe. */
  const rating = new Map();
  const runCount = new Map();
  const timesDG = new Map();
  const timesD = new Map();
  const drawSum = new Map();
  let marginSum = 0;
  let marginN = 0;
  const parOf = list => (list && list.length >= 8) ? glmMedian(list) : null;

  for (const race of races) {
    const weights = race.members.map(m => m.weight).filter(w => w > 0);
    const medW = weights.length ? glmMedian(weights) : 0;
    const distFactor = Math.max(0.85, Math.min(1.75, race.distM / 1400));
    const finishCount = race.members.filter(m => m.finished).length;
    race.weak = finishCount < 3;

    let winTime = null;
    for (const m of race.members) {
      if (m.rank === 1 && m.time) winTime = winTime === null ? m.time : Math.min(winTime, m.time);
    }
    for (const m of race.members) {
      let lengths = 16;
      if (m.finished) {
        if (winTime && m.time && m.time >= winTime - 0.03) {
          const secPerLen = 2.5 * winTime / race.distM;
          lengths = glmClamp((m.time - winTime) / secPerLen, 0, 20);
        } else lengths = glmClamp((m.rank - 1) * 1.2, 0, 20);
      }
      m.lengths = lengths;
    }

    const globalMean = marginN ? marginSum / marginN : 4;
    for (const m of race.members) {
      let drawBias = 0;
      if (m.finished && m.gate >= 1) {
        const stat = drawSum.get(glmDistBand(race.distM) + '|' + glmGateBucket(m.gate));
        if (stat && stat.n >= 20) drawBias = glmClamp(globalMean - stat.sum / stat.n, -1.2, 1.2);
      }
      m.drawBias = drawBias;
      const wPen = m.weight > 0 && medW > 0 ? (m.weight - medW) * 0.11 * distFactor : 0;
      m.adjMargin = m.lengths + drawBias - m.trip + wPen;
      m.weakRace = race.weak;
    }

    const rated = race.members.filter(m => m.finished);
    let fieldAbility = 0;
    if (rated.length) {
      let sum = 0;
      for (const m of rated) sum += rating.get(m.horse) || 0;
      fieldAbility = sum / rated.length;
    }
    let avgAdj = 0;
    if (rated.length) {
      let total = 0;
      for (const m of rated) total += m.adjMargin;
      avgAdj = total / rated.length;
    }
    for (const m of race.members) {
      m.preRating = rating.get(m.horse) || 0;
      m.fieldAbility = fieldAbility;
      const perf = m.finished
        ? glmClamp(fieldAbility + (avgAdj - m.adjMargin), -12, 10)
        : glmClamp(fieldAbility - 7.5, -12, -2);
      m.perf = perf;
      const n = runCount.get(m.horse) || 0;
      const k = m.finished ? (n < 4 ? 0.4 : 0.22) : 0.12;
      const before = rating.get(m.horse) || 0;
      const after = before + k * (perf - before);
      rating.set(m.horse, after);
      m.postRating = after;
      runCount.set(m.horse, n + 1);
    }

    for (const m of race.members) {
      const par = parOf(timesDG.get(race.dist + '|' + m.going)) || parOf(timesD.get(race.dist));
      if (m.finished && m.time && par) {
        const secPerLen = 2.5 * par / race.distM;
        const wAdv = m.weight > 0 && medW > 0 ? (medW - m.weight) * 0.11 * distFactor : 0;
        m.speed = glmClamp((par - m.time) / secPerLen - m.drawBias + wAdv, -12, 10);
      } else {
        m.speed = null;
      }
      if (m.finished) {
        if (m.time) {
          const dg = race.dist + '|' + m.going;
          if (!timesDG.has(dg)) timesDG.set(dg, []);
          timesDG.get(dg).push(m.time);
          if (!timesD.has(race.dist)) timesD.set(race.dist, []);
          timesD.get(race.dist).push(m.time);
        }
        if (m.gate >= 1) {
          const key = glmDistBand(race.distM) + '|' + glmGateBucket(m.gate);
          const stat = drawSum.get(key) || { sum: 0, n: 0 };
          stat.sum += m.lengths;
          stat.n += 1;
          drawSum.set(key, stat);
          marginSum += m.lengths;
          marginN += 1;
        }
      }
    }
  }

  const byHorse = new Map();
  const byJockey = new Map();
  const byTrainer = new Map();
  const roster = new Map();
  for (const race of races) {
    roster.set(race.raceKey, race.members.map(m => ({ horse: m.horse, rank: m.rank })));
    for (const m of race.members) {
      if (!byHorse.has(m.horse)) byHorse.set(m.horse, []);
      byHorse.get(m.horse).push(m);
      if (m.jockey) {
        if (!byJockey.has(m.jockey)) byJockey.set(m.jockey, []);
        byJockey.get(m.jockey).push(m);
      }
      if (m.trainer) {
        if (!byTrainer.has(m.trainer)) byTrainer.set(m.trainer, []);
        byTrainer.get(m.trainer).push(m);
      }
    }
  }
  for (const runs of byHorse.values()) runs.sort((a, b) => a.date.localeCompare(b.date) || a.raceNo - b.raceNo);
  for (const runs of byJockey.values()) runs.sort((a, b) => a.epoch - b.epoch);
  for (const runs of byTrainer.values()) runs.sort((a, b) => a.epoch - b.epoch);

  const drawAfterByDate = new Map();
  const runningDraw = new Map();
  let runningLengthSum = 0;
  let runningLengthN = 0;
  let runningDate = '';
  const drawSnapshot = () => ({
    mean: runningLengthN ? runningLengthSum / runningLengthN : 4,
    stats: new Map([...runningDraw].map(([key, value]) => [key, { ...value }])),
  });
  for (const race of races) {
    if (race.date !== runningDate && runningDate) drawAfterByDate.set(runningDate, drawSnapshot());
    runningDate = race.date;
    for (const m of race.members) {
      if (!m.finished || m.gate < 1) continue;
      const key = glmDistBand(race.distM) + '|' + glmGateBucket(m.gate);
      const stat = runningDraw.get(key) || { sum: 0, n: 0 };
      stat.sum += m.lengths;
      stat.n += 1;
      runningDraw.set(key, stat);
      runningLengthSum += m.lengths;
      runningLengthN += 1;
    }
  }
  if (runningDate) drawAfterByDate.set(runningDate, drawSnapshot());
  const drawDates = [...drawAfterByDate.keys()];
  GLM_IDX = {
    byHorse, byJockey, byTrainer, roster, races,
    drawBiasOf: (key, asOfDate) => {
      let low = 0;
      let high = drawDates.length;
      while (low < high) {
        const middle = (low + high) >> 1;
        if (drawDates[middle] < asOfDate) low = middle + 1;
        else high = middle;
      }
      if (low === 0) return 0;
      const snapshot = drawAfterByDate.get(drawDates[low - 1]);
      const stat = snapshot.stats.get(key);
      if (!stat || stat.n < 20 || !snapshot.mean) return 0;
      return glmClamp(snapshot.mean - stat.sum / stat.n, -1.2, 1.2);
    },
  };
}

function buildGlmFeatures(entries, race) {
  if (!GLM_IDX || !entries || entries.length < 2) return null;
  const asOfDate = String((race && race.date) || (RACECARD && RACECARD.date) || '');
  const asOfEpoch = glmEpoch(asOfDate);
  const epochCut = Number.isFinite(asOfEpoch) ? asOfEpoch : Infinity;
  const distance = String((race && race.distance) || '');
  const distM = parseInt(distance, 10) || 1200;
  const going = glmGoingCat(race && race.going);
  const venue = String((race && race.venue) || (RACECARD && RACECARD.venue) || glmVenueOf(distM) || '').toUpperCase();
  const distFactor = Math.max(0.85, Math.min(1.75, distM / 1400));
  const rivals = new Set(entries.map(e => glmStrip(e.horse_name)).filter(Boolean));

  const carriedOf = e => {
    const rider = glmParseRider(e.jockey);
    const allocated = parseFloat(e.weight);
    return { rider, carried: Number.isFinite(allocated) ? allocated - rider.claim : NaN };
  };
  const carriedList = entries.map(e => carriedOf(e).carried).filter(w => Number.isFinite(w) && w > 0);
  const fieldMed = carriedList.length ? glmMedian(carriedList) : 0;
  let priorWins = 0;
  let priorPlaces = 0;
  let priorFinishers = 0;
  for (const priorRace of GLM_IDX.races) {
    if (priorRace.date >= asOfDate) break;
    for (const runner of priorRace.members) {
      if (!runner.finished) continue;
      priorFinishers += 1;
      if (runner.win) priorWins += 1;
      if (runner.place) priorPlaces += 1;
    }
  }
  const p0Win = priorFinishers ? priorWins / priorFinishers : 0.08;
  const p0Place = priorFinishers ? priorPlaces / priorFinishers : 0.24;

  const riderCache = new Map();
  const trainerCache = new Map();
  const personScore = (name, kind) => {
    if (!name) return 0;
    const cache = kind === 'jockey' ? riderCache : trainerCache;
    if (cache.has(name)) return cache.get(name);
    const runs = (kind === 'jockey' ? GLM_IDX.byJockey : GLM_IDX.byTrainer).get(name) || [];
    let score = 0;
    const hist = runs.filter(r => r.epoch < epochCut);
    if (hist.length) {
      let wSum = 0, winSum = 0, plcSum = 0;
      for (const r of hist) {
        const days = Math.max(0, (epochCut - r.epoch) / 86400000);
        const w = Math.exp(-days / 170);
        wSum += w;
        if (r.win) winSum += w;
        if (r.place) plcSum += w;
      }
      if (wSum > 0) {
        const z = wSum / (wSum + (kind === 'jockey' ? 18 : 22));
        score = z * (0.6 * (plcSum / wSum - p0Place) + 0.4 * (winSum / wSum - p0Win)) * 8;
      }
    }
    cache.set(name, score);
    return score;
  };
  const hotEdge = (runs, windowDays, minStarts) => {
    const hist = (runs || []).filter(r => r.epoch < epochCut);
    if (!hist.length) return 0;
    let careerN = 0, careerW = 0, recentN = 0, recentW = 0;
    const start = epochCut - windowDays * 86400000;
    for (const r of hist) {
      careerN += 1;
      if (r.win) careerW += 1;
      if (r.epoch >= start) {
        recentN += 1;
        if (r.win) recentW += 1;
      }
    }
    if (recentN < minStarts || careerN < recentN + 5) return 0;
    return recentW / recentN - careerW / careerN;
  };

  const ctx = entries.map(entry => {
    const horse = glmStrip(entry.horse_name);
    const rider = glmParseRider(entry.jockey);
    const trainer = String(entry.trainer || '').trim();
    const gate = parseInt(entry.gate, 10) || 0;
    const carried = carriedOf(entry).carried;
    const history = (GLM_IDX.byHorse.get(horse) || []).filter(r => r.epoch < epochCut);

    const margin = glmDecayedMean(history, epochCut, r => r.postRating, r => r.weakRace ? 0.45 : 1);
    const speed = glmDecayedMean(history, epochCut, r => r.speed, r => r.weakRace ? 0.45 : 1);
    const z = margin.nEff / (margin.nEff + 4);
    const speedMean = speed.nEff >= 0.8 ? speed.mean : margin.mean;
    const ability = z * (0.8 * margin.mean + 0.2 * speedMean);

    const exact = history.filter(r => r.dist === distance);
    const near = exact.length >= 2 ? exact : history.filter(r => Math.abs(r.distM - distM) <= 200);
    const distStats = glmDecayedMean(near, epochCut, r => r.postRating, r => (r.weakRace ? 0.45 : 1) * (r.dist === distance ? 1 : 0.62));
    const zD = distStats.nEff / (distStats.nEff + 2.2);
    const distEdge = glmClamp(zD * (distStats.mean - margin.mean), -1.4, 1.4);

    let formW = 0, formSum = 0;
    for (const r of history.slice(-6)) {
      if (!r.finished) continue;
      const days = Math.max(0, (epochCut - r.epoch) / 86400000);
      const w = Math.exp(-days / 118) * (r.dist === distance ? 1.28 : 1);
      const pt = r.rank === 1 ? 1 : r.rank <= 3 ? 0.66 : r.rank <= 5 ? 0.3 : r.rank <= 7 ? 0.08 : 0;
      formW += w;
      formSum += pt * w;
    }
    const formPts = formW ? formSum / formW : 0.3;

    const trend = history.length >= 3
      ? glmClamp((history[history.length - 1].postRating - history[history.length - 3].postRating) * 0.08, -0.3, 0.32) : 0;

    let volPen = 0;
    if (history.length >= 4) {
      const recent = history.slice(-8);
      const mean = recent.reduce((s, r) => s + r.postRating, 0) / recent.length;
      const variance = recent.reduce((s, r) => s + (r.postRating - mean) ** 2, 0) / recent.length;
      volPen = Math.min(0.45, Math.sqrt(variance) * 0.045);
    }

    const last = history.length ? history[history.length - 1] : null;
    const daysSince = last ? Math.max(0, (epochCut - last.epoch) / 86400000) : NaN;
    const bounce = last && last.trip >= 0.85 && last.rank >= 4 && last.rank <= 11 && daysSince <= 75
      ? Math.min(0.8, last.trip * 0.3) : 0;

    const weightAdj = fieldMed > 0 && Number.isFinite(carried) ? (fieldMed - carried) * 0.11 * distFactor : 0;

    const drawKey = gate >= 1 ? glmDistBand(distM) + '|' + glmGateBucket(gate) : null;
    const drawAdj = drawKey
      ? glmClamp(GLM_IDX.drawBiasOf(drawKey, asOfDate) * 0.85 + glmVenueDrawPrior(venue, distM, gate) * 0.62, -0.7, 0.6)
      : 0;

    const jockeyScore = personScore(rider.name, 'jockey');
    const trainerScore = personScore(trainer, 'trainer');

    const sameRider = history.filter(r => r.jockey && r.jockey === rider.name);
    let combo = 0;
    if (sameRider.length) {
      const comboWins = sameRider.filter(r => r.win).length;
      if (comboWins >= 1) combo = 0.26 + Math.min(0.22, (comboWins - 1) * 0.07);
      else if (sameRider.length >= 4) combo = -0.16;
    }

    const seen = new Set();
    const usualScores = [];
    for (let i = history.length - 1; i >= 0 && usualScores.length < 4; i--) {
      const name = history[i].jockey;
      if (!name || seen.has(name)) continue;
      seen.add(name);
      usualScores.push(personScore(name, 'jockey'));
    }
    const usual = usualScores.length ? usualScores.reduce((s, v) => s + v, 0) / usualScores.length : 0;
    const upgrade = history.length ? jockeyScore - usual : 0;

    const jHot = glmClamp(hotEdge(GLM_IDX.byJockey.get(rider.name), 60, 12) * 4.5, -0.4, 0.42);
    const tHot = glmClamp(hotEdge(GLM_IDX.byTrainer.get(trainer), 45, 8) * 4.2, -0.35, 0.38);

    let h2h = 0;
    for (let i = Math.max(0, history.length - 10); i < history.length; i++) {
      const r = history[i];
      const field = GLM_IDX.roster.get(r.raceKey);
      if (!field) continue;
      const daysAgo = Math.max(0, (epochCut - r.epoch) / 86400000);
      if (daysAgo > 420) continue;
      for (const other of field) {
        if (other.horse === horse || !rivals.has(other.horse)) continue;
        const beat = r.rank < other.rank ? 1 : r.rank > other.rank ? 0 : 0.5;
        h2h += (beat - 0.5) * 0.5 * Math.exp(-daysAgo / 200) * (r.dist === distance ? 1 : 0.7);
      }
    }
    h2h = glmClamp(h2h, -0.75, 0.75);

    let goingAdj = 0;
    if (going && going !== '其他') {
      const goingRuns = history.filter(r => r.going === going);
      if (goingRuns.length >= 2) {
        const gMean = goingRuns.reduce((s, r) => s + r.postRating, 0) / goingRuns.length;
        goingAdj = glmClamp((gMean - margin.mean) * 0.3, -0.35, 0.35);
      }
    }

    let styleW = 0, styleSum = 0, styleN = 0;
    for (const r of history) {
      if (r.style === null) continue;
      const days = Math.max(0, (epochCut - r.epoch) / 86400000);
      const w = Math.exp(-days / 160);
      styleW += w;
      styleSum += r.style * w;
      styleN += 1;
    }
    const style = styleW ? styleSum / styleW : null;

    const speedFig = speed.nEff >= 0.8 ? speed.mean : 0;

    return {
      entry, horse, gate, style, styleN,
      ability, distEdge, formPts, trend, volPen,
      daysSince, bounce, weightAdj, drawAdj,
      jockeyScore, trainerScore, combo, upgrade, jHot, tHot,
      h2h, goingAdj, speedFig,
      nEff: margin.nEff, last,
    };
  });

  const knownRaw = ctx.filter(c => c.nEff >= 1.2);
  const todayClass = knownRaw.length ? knownRaw.reduce((s, c) => s + c.ability, 0) / knownRaw.length : 0;
  const knownStyle = ctx.filter(c => c.styleN >= 2 && c.style !== null).length;
  const paceOn = knownStyle >= Math.min(4, Math.ceil(ctx.length * 0.35));
  const frontCount = paceOn ? ctx.filter(c => c.styleN >= 2 && c.style >= 0.5).length : 0;
  const neutralPace = distM >= 1800 ? 1.6 : distM >= 1400 ? 2 : 2.3;

  return ctx.map(c => {
    const styleConf = c.style === null ? 0 : Math.min(1, c.styleN / 4);
    let paceAdj = 0;
    if (paceOn && styleConf > 0) {
      paceAdj = styleConf * (frontCount - neutralPace) * (-0.3 * c.style);
      if (distM <= 1200 && c.gate >= 11 && c.style > 0.4) paceAdj -= 0.32 * styleConf;
      if (distM <= 1200 && c.gate <= 3 && c.style > 0.4) paceAdj += 0.18 * styleConf;
      if (distM >= 1600 && c.style < -0.4 && frontCount >= 3) paceAdj += 0.12 * styleConf;
      paceAdj = glmClamp(paceAdj, -0.8, 0.8) * 0.75;
    }
    const classAdj = c.last && !c.last.weakRace && Number.isFinite(c.daysSince) && c.daysSince <= 120 && c.nEff >= 1.4
      ? glmClamp((c.last.fieldAbility - todayClass) * 0.4, -1, 1) : 0;
    const gateSprint = distM <= 1400 && c.gate >= 1 && c.gate <= 4 ? 1 : 0;
    return [
      c.ability,          // 0 實力評分
      c.distEdge,         // 1 同程優勢
      c.formPts,          // 2 近仗入位
      c.trend,            // 3 狀態趨勢
      c.volPen,           // 4 發揮波動
      Number.isFinite(c.daysSince) ? Math.log1p(Math.min(400, c.daysSince)) : Math.log1p(400), // 5 復出週期
      c.bounce,           // 6 上仗受阻
      c.weightAdj,        // 7 負磅輕盈
      c.drawAdj,          // 8 檔位有利
      c.jockeyScore,      // 9 騎師質素
      c.trainerScore,     // 10 練馬師質素
      c.combo,            // 11 人馬合拍
      c.upgrade,          // 12 換騎升級
      c.jHot,             // 13 騎師手熱
      c.tHot,             // 14 練馬師熱
      c.h2h,              // 15 對頭馬佔優
      c.goingAdj,         // 16 場地合拍
      paceAdj,            // 17 步速對路
      classAdj,           // 18 對手轉弱
      c.speedFig,         // 19 速度指數
      gateSprint,         // 20 內檔短途
    ];
  });
}

function glmPlProbs(utilities) {
  const safe = utilities.map(u => (Number.isFinite(u) ? u : 0));
  const maxU = Math.max(...safe);
  const s = safe.map(u => Math.exp(u - maxU));
  const total = s.reduce((sum, v) => sum + v, 0) || 1;
  const n = s.length;
  const win = s.map(v => v / total);
  const place = new Array(n).fill(0);
  if (n < 3) {
    place.fill(1);
    return { win, place };
  }
  for (let i = 0; i < n; i++) {
    const rest1 = total - s[i];
    if (rest1 <= 0) continue;
    for (let j = 0; j < n; j++) {
      if (j === i) continue;
      const rest2 = rest1 - s[j];
      if (rest2 <= 0) continue;
      for (let k = 0; k < n; k++) {
        if (k === i || k === j) continue;
        const p = (s[i] / total) * (s[j] / rest1) * (s[k] / rest2);
        place[i] += p;
        place[j] += p;
        place[k] += p;
      }
    }
  }
  return { win, place };
}

function buildGlmPrediction(entries, race) {
  const features = buildGlmFeatures(entries, race);
  if (!features || features.length < 2) return [];
  const scored = features.map((row, index) => {
    const contributions = row.map((value, c) => {
      const raw = Number.isFinite(value) ? value : GLM.MEAN[c];
      const sd = GLM.STD[c] > 1e-9 ? GLM.STD[c] : 1;
      return ((raw - GLM.MEAN[c]) / sd) * GLM.BETA[c];
    });
    const score = contributions.reduce((sum, v) => sum + v, 0);
    const ranked = contributions.map((value, c) => ({ value, c })).sort((a, b) => b.value - a.value);
    const reasons = ranked.filter(r => r.value >= 0.05).slice(0, 2).map(r => GLM.LABELS[r.c]);
    if (!reasons.length) reasons.push('綜合洞燭均衡');
    return { entry: entries[index], horse: glmStrip(entries[index].horse_name), score, contributions, reasons };
  });
  const probs = glmPlProbs(scored.map(item => item.score));
  scored.forEach((item, index) => {
    item.prob = probs.win[index];
    item.placeProb = Math.max(0, Math.min(1, probs.place[index]));
  });
  scored.sort((a, b) => b.prob - a.prob || Number(a.entry.horse_no) - Number(b.entry.horse_no));
  const top = scored[0];
  const topName = String(top.horse || '').replace(/[<>&]/g, '');
  const lead = top.contributions.map((value, c) => ({ value, c })).sort((a, b) => b.value - a.value)[0];
  scored.insight = `洞燭先機 · 21維在線評分特徵 · 主要訊號：${lead && lead.value >= 0.05 ? GLM.LABELS[lead.c] : '—'} · 首選 ${top.entry.horse_no} ${topName}（勝率 ${(top.prob * 100).toFixed(1)}% · 入位 ${(top.placeProb * 100).toFixed(0)}%）`;
  return scored;
}

/* ── Render race strip (mobile) ─────────────────── */
function renderRaceStrip() {
  if (!$raceStrip || !RACECARD || !RACECARD.races) return;
  $raceStrip.innerHTML = '';
  RACECARD.races.forEach(race => {
    const div = document.createElement('div');
    div.className = 'race-bubble' + (race.race_no === activeRace ? ' active' : '');
    div.innerHTML = `<div class="rb-circle">${race.race_no}</div>`;
    div.addEventListener('click', () => selectRace(race.race_no));
    $raceStrip.appendChild(div);
  });
  const activeEl = $raceStrip.querySelector('.race-bubble.active');
  if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

/* ── Render race list ────────────────────────────── */
function renderRaceList() {
  $raceList.innerHTML = '';
  renderRaceStrip();
  if (!RACECARD || !RACECARD.races) return;
  RACECARD.races.forEach(race => {
    const div = document.createElement('div');
    div.className = 'race-item' + (race.race_no === activeRace ? ' active' : '');
    div.innerHTML = `
      <div class="race-num">${race.race_no}</div>
      <div class="race-info">
        <div class="race-meta">${RACECARD.demo ? '歷史賽事預覽' : '本地賽事 &nbsp;·&nbsp; 下場參考'}</div>

        <div class="race-going">${race.going || '—'}</div>
      </div>
      <div class="race-chevron">›</div>`;
    div.addEventListener('click', () => selectRace(race.race_no));
    $raceList.appendChild(div);
  });
}

/* ── Render detail panel ────────────────────────── */
function renderDetail() {
  if (!activeRace) {
    if ($emptyState) $emptyState.hidden = false;
    $detailContent.hidden = true;
    return;
  }
  if ($emptyState) $emptyState.hidden = true;
  $detailContent.hidden = false;

  const race = RACECARD.races.find(r => r.race_no === activeRace);
  if (!race) return;

  const sorted = [...(race.entries || [])].sort((a, b) =>
    parseInt(a.horse_no) - parseInt(b.horse_no));
  const detailLabel = RACECARD.demo
    ? `歷史賽事預覽 · 排位由賽果重建；只使用 ${RACECARD.date} 前的歷史資料`
    : `本地賽事 · 下場分析參考（資料日期：${RACECARD.date}）`;

  let cards = '';
  for (const entry of sorted) {
    const horse   = stripCode(entry.horse_name);
    const jockey  = entry.jockey;
    const trainer = entry.trainer;
    const weight  = entry.weight;
    const gate    = entry.gate;
    const silkUrl = entry.silk_url || '';

    const pos      = typicalPos(horse);
    const rec      = jockeyRecord(horse, jockey);
    const recClass = rec.total === 0 ? 'rec-1st' : rec.hasWin ? 'rec-win' : 'rec-nw';
    const trj      = trainerJockeyWinPct(trainer, jockey);
    const form     = sameDistChips(horse, race.distance);

    cards += `
      <div class="horse-card">
        <div class="horse-num">
          ${entry.horse_no}
          ${silkUrl ? `<div class="silk-wrap"><img class="silk-img" src="${silkUrl}" loading="lazy" onerror="this.parentNode.style.display='none'"></div>` : ''}
        </div>
        <div class="horse-left">
          <div class="h-name">${horse}</div>
          <div class="h-jockey"><span class="h-label">騎師</span>${jockey}</div>
          <div class="h-trainer"><span class="h-label">練馬師</span>${trainer}</div>
        </div>
        <div class="horse-gw">
          <div class="hg-num">${gate}</div>
          <div class="hg-weight">${weight}<span class="weight-unit">磅</span></div>
        </div>
        <div class="horse-rec">
          <span class="badge ${recClass}">${rec.label}</span>
        </div>
        <div class="horse-trj">
          <span class="badge ${trj.cls}">${trj.label}</span>
        </div>
        <div class="horse-right">
          <div class="hr-row2">${posTri(pos)}</div>
          <div class="hr-row3"><div class="form-chips">${form}</div></div>
        </div>
        <div class="horse-meta-row">
          <span class="hm-gate">檔 ${gate}</span>
          <span class="hm-weight">${weight}磅</span>
          <span class="badge ${recClass}">${rec.label}</span>
          <span class="badge ${trj.cls}">${trj.label}</span>
          ${posTri(pos)}
          <div class="form-chips">${form}</div>
        </div>
      </div>`;
  }

  // Prediction box
  const preds   = buildPrediction(race.entries || [], race.distance);
  const maxScore= preds.length ? preds[0].score : 1;
  const medals  = ['🥇','🥈','🥉','4️⃣'];
  const sCls    = ['pred-s1','pred-s2','pred-s3','pred-s4'];
  const predHTML= preds.length < 2 ? '' : (() => {
    const slots = preds.slice(0, 4).map((p, i) => {
      const pct = Math.min(92, Math.round(p.score / maxScore * 60 + 32));
      const horseName = p.entry ? stripCode(p.entry.horse_name) : p.horse;
      const horseNo   = p.entry ? p.entry.horse_no : '';
      const actual = RACECARD.demo && p.entry
        ? `<div class="pred-actual">${actualRankLabel2(p.entry)}</div>` : '';
      return `<div class="pred-slot ${sCls[i]}">
        <div class="pred-rank">${medals[i]} 第${i+1}位</div>
        <div class="pred-horse">${horseNo} · ${horseName}</div>
        <div class="pred-bar-wrap">
          <div class="pred-bar-bg"><div class="pred-bar" style="width:${pct}%"></div></div>
          <span class="pred-pct">${pct}%</span>
        </div>
        <div class="pred-reason">${p.reasons.length ? p.reasons.join(' · ') : '資料不足'}</div>
        ${actual}
      </div>`;
    }).join('');
    const order = preds.slice(0, 4).map(p => p.entry ? p.entry.horse_no : '').filter(Boolean).join('-');
    return `<details class="pred-box pred-panel" open>
      <summary class="pred-title">
        <span class="pred-heading-label">加權評分</span>
        <span class="pred-order" aria-label="預測第1至第4名">${order}</span>
      </summary>
      <div class="pred-grid">${slots}</div>
    </details>`;
  })();
  let glmPreds = [];
  try {
    glmPreds = buildGlmPrediction(race.entries || [], race) || [];
  } catch (e) {
    console.warn('GLM 5.3 洞燭先機預測失敗', e);
    glmPreds = [];
  }
  const glmHTML = glmPreds.length < 2 ? '' : (() => {
    const mark = item => {
      const lead = item.contributions.map((value, c) => ({ value, c })).sort((a, b) => b.value - a.value)[0];
      return `<span class="pred-glm-badge">${lead && lead.value >= 0.05 ? GLM.LABELS[lead.c] : '綜合'}</span>`;
    };
    const slots = glmPreds.slice(0, 4).map((item, index) => {
      const probability = item.prob * 100;
      const horseNo = item.entry ? String(item.entry.horse_no) : '';
      const horseName = item.entry ? stripCode(item.entry.horse_name) : item.horse;
      const actual = RACECARD.demo && item.entry
        ? `<div class="pred-actual">${actualRankLabel2(item.entry)}</div>` : '';
      return `<div class="pred-slot ${sCls[index]}">
        <div class="pred-rank">${medals[index]} 第${index + 1}位${mark(item)}</div>
        <div class="pred-horse">${horseNo} · ${horseName}</div>
        <div class="pred-bar-wrap">
          <div class="pred-bar-bg"><div class="pred-bar" style="width:${Math.min(100, Math.max(0, probability))}%"></div></div>
          <span class="pred-pct">${probability.toFixed(1)}%</span>
        </div>
        <div class="pred-reason">入位 ${(item.placeProb * 100).toFixed(0)}% · ${item.reasons.join(' · ')}</div>
        ${actual}
      </div>`;
    }).join('');
    const order = glmPreds.slice(0, 4).map(item => item.entry ? item.entry.horse_no : '').filter(Boolean).join('-');
    const insight = glmPreds.insight ? `<div class="pred-insight">${glmPreds.insight}</div>` : '';
    return `<details class="pred-box pred-box-glm pred-panel" open>
      <summary class="pred-title">
        <span class="pred-heading-label">GLM 5.3 洞燭先機</span>
        <span class="pred-order" aria-label="預測第1至第4名">${order}</span>
      </summary>
      ${insight}
      <div class="pred-grid">${slots}</div>
    </details>`;
  })();
  $detailContent.innerHTML = `
    <div class="detail-hdr">
      <div class="detail-label">${detailLabel}</div>
      <div class="detail-title">第 ${race.race_no} 場 &nbsp;·&nbsp; ${race.distance || ''}</div>
      <div class="detail-meta">場地狀況：${race.going || '—'}</div>
    </div>
    ${predHTML}
    ${glmHTML}
    <div class="card-legend">
      <div class="cl-left">馬名 / 騎師 / 練馬師</div>
      <div class="cl-gw">檔 / 磅</div>
      <div class="cl-rec">騎配</div>
      <div class="cl-trj">師騎勝率</div>
      <div class="cl-right">
        <span>走位（前 → 後）</span>
        <span>同程成績</span>
      </div>
    </div>
    ${cards}
    <div style="height:16px"></div>`;
}

/* ── Select a race ───────────────────────────────── */
function selectRace(raceNo) {
  activeRace = raceNo;
  renderRaceList();
  renderDetail();
  if (window.innerWidth <= 679) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

/* ── UI state helpers ────────────────────────────── */
function showLoading(on) {
  $overlay.classList.toggle('hidden', !on);
}
function showFullstate(icon, title, msg, showRetry) {
  document.getElementById('fullstateIcon').textContent  = icon;
  document.getElementById('fullstateTitle').textContent = title;
  document.getElementById('fullstateMsg').textContent   = msg;
  $retryBtn.classList.toggle('hidden', !showRetry);
  $fullstate.classList.remove('hidden');
  $mainLayout.classList.add('hidden');
  $raceStrip.classList.add('hidden');
}

/* ── Data loading ─────────────────────────────────── */
async function loadData() {
  showLoading(true);
  $fullstate.classList.add('hidden');
  $mainLayout.classList.add('hidden');

  try {
    const demoMode = new URLSearchParams(window.location.search).get('demo') === 'previous';
    const localHistory = demoMode && ['localhost', '127.0.0.1'].includes(window.location.hostname);
    const historyUrl = localHistory
      ? '../hkjc_scraper/data/all_results.csv'
      : `${SCRAPER_RAW}/data/all_results.csv`;
    const [racecard, csvText] = await Promise.all([
      demoMode ? Promise.resolve(null) : fetch(`${SCRAPER_RAW}/data/racecard_today.json`).then(r => {
        if (!r.ok) throw new Error(`racecard_today.json 下載失敗 (${r.status})`);
        return r.json();
      }),
      fetch(historyUrl).then(r => {
        if (!r.ok) throw new Error(`all_results.csv 下載失敗 (${r.status})`);
        return r.text();
      }),
    ]);

    D        = parseCSV(csvText);
    if (demoMode) {
      const demo = buildPreviousRaceDemo(D);
      D = demo.history;
      RACECARD = demo.racecard;
    } else {
      RACECARD = normalizeRacecardData(racecard);
    }
    try {
      buildGlmIndexes();
    } catch (e) {
      console.warn('GLM 5.3 洞燭先機索引建立失敗，該預測不可用', e);
      GLM_IDX = null;
    }
    if (!RACECARD.races || !RACECARD.races.length) {
      showFullstate('📅', '暫未有可用本地賽事卡', '如馬會已發佈下一賽日資料，請稍後重試。', false);
      $hdrDate.textContent = '無賽事';
      return;
    }

    // Init UI
    const dateStr = RACECARD.date || '—';
    $hdrDate.textContent  = dateStr + ' 賽事';
    $panelDate.textContent = dateStr;

    activeRace = RACECARD.races[0].race_no;
    $mainLayout.classList.remove('hidden');
    $raceStrip.classList.remove('hidden');
    renderRaceList();
    renderDetail();

  } catch (e) {
    console.error(e);
    showFullstate('⚠️', '資料載入失敗', e.message, true);
    $hdrDate.textContent = '載入失敗';
  } finally {
    showLoading(false);
  }
}

/* ── Bootstrap ───────────────────────────────────── */
loadData();
</script>
</body>
</html>
