      if (distM <= 1200 && item.gate <= 3 && item.style > 0.4) paceAdj += 0.18 * styleConf;
      if (distM >= 1600 && item.style < -0.4 && frontCount >= 3) paceAdj += 0.12 * styleConf;
      paceAdj = clamp4(paceAdj, -0.8, 0.8) * A4.W_PACE;
    }
    const classAdj = item.last && !item.last.weakRace && item.daysSince <= 120 && item.nEff >= 1.4
      ? clamp4((item.last.fieldAbility - todayClass) * A4.W_CLASS, -1, 1) : 0;
    const known = item.nEff / (item.nEff + 1.6);
    const jockeyTerm = item.jockeyNow.score * A4.W_JOCKEY;
    const upgradeTerm = clamp4(item.upgrade, -0.85, 0.9) * A4.W_UPGRADE;
    const trainerTerm = item.trainerNow.score * A4.W_TRAINER * (1.35 - 0.7 * known);
    const utility = clamp4(
      item.ability +
      item.distEdge * A4.W_DIST +
      jockeyTerm + upgradeTerm + item.jHot * A4.W_JHOT +
      trainerTerm + item.tHot * A4.W_THOT +
      item.weightAdj + item.drawAdj + paceAdj + item.freshAdj + item.bounce +
      classAdj + item.h2h + item.trend + item.lastEdge + item.formAdj + item.combo +
      item.goingAdj + item.distChange - item.volPenalty,
      -8, 8);

    const reasonRows = [];
    const pushReason = (label, value) => { if (value >= 0.16) reasonRows.push({ label, value }); };
    pushReason('隱性評分領先', item.ability - todayField);
    pushReason('近仗入位穩', item.formAdj);
    pushReason('同程評分更高', item.distEdge * A4.W_DIST);
    pushReason('騎師優勢', jockeyTerm);
    pushReason('換騎升級', upgradeTerm);
    pushReason('騎師手風順', item.jHot * A4.W_JHOT);
    pushReason('練馬師近態熱', item.tHot * A4.W_THOT);
    pushReason('減磅實惠', item.rider.claim >= 5 ? Math.max(item.weightAdj, item.rider.claim * 0.08) : 0);
    pushReason('負磅輕盈', item.rider.claim >= 5 ? 0 : item.weightAdj);
    pushReason('檔位有利', item.drawAdj);
    pushReason('步速對路', paceAdj);
    pushReason('上仗受阻可反彈', item.bounce);
    pushReason('休賽週期理想', item.freshAdj);
    pushReason('對手轉弱', classAdj);
    pushReason('對頭馬佔優', item.h2h);
    pushReason('人馬合拍', item.combo);
    pushReason('場地合拍', item.goingAdj);
    pushReason('路程更合腳程', item.distChange);
    reasonRows.sort((a, b) => b.value - a.value);
    const reasons = reasonRows.slice(0, 2).map(row => row.label);
    if (!reasons.length) reasons.push(item.nEff < 1 ? '初出無往績' : '綜合對壘均衡');
    return {
      entry: item.entry, horse: item.horse, score: utility, reasons,
      ability: item.ability, nEff: item.nEff,
    };
  });

  const probs = plProbs4(scored.map(item => item.score));
  scored.forEach((item, index) => {
    item.prob = probs.win[index];
    item.placeProb = Math.max(0, Math.min(1, probs.place[index]));
  });
  scored.sort((a, b) => b.prob - a.prob || Number(a.entry.horse_no) - Number(b.entry.horse_no));

  let paceText = '步速資料不足 · 以實力與檔位為主';
  if (paceOn) {
    if (frontCount >= neutralPace + 1.4) paceText = `快步速對壘（${frontCount}匹前領）· 後上馬受惠`;
    else if (frontCount + 0.2 <= neutralPace - 1.3) {
      paceText = frontCount === 0
        ? '慢步速對壘（未見明確領放）· 能搶放者受惠'
        : `慢步速對壘（前領${frontCount}匹）· 領放馬受惠`;
    }
    else paceText = `均速對壘（${frontCount}匹前領）· 位距與檔位決勝負`;
  }
  const gap = scored.length > 4 ? scored[3].score - scored[4].score : 0.6;
  const conf = gap >= 0.45 ? '高' : gap >= 0.18 ? '中' : '低';
  const top = scored[0];
  const second = scored[1];
  const no1 = top.entry ? top.entry.horse_no : '';
  const no2 = second && second.entry ? second.entry.horse_no : '';
  const topName = String(top.horse || '').replace(/[<>&]/g, '');
  const thin = top.nEff < 1.2 ? ' · 首選往績少已折扣' : '';
  scored.insight = `${paceText} · 頭四信心${conf} · 對壘 ${no1} 對 ${no2} · 首選 ${no1} ${topName}（勝率 ${(top.prob * 100).toFixed(1)}% · 入位 ${(top.placeProb * 100).toFixed(0)}%）${thin}`;
  return scored;
}

function modelCountText5(count) {
  if (count === 2) return '雙';
  return ['零', '一', '', '三', '四'][count] || String(count);
}

function buildPrediction5(entries, modelPredictions) {
  if (!entries || entries.length < 2 || !Array.isArray(modelPredictions)) return [];
  const models = modelPredictions.map((prediction, index) => {
    const ranks = new Map();
    if (Array.isArray(prediction)) {
      prediction.forEach((item, rankIndex) => {
        const horseNo = String(item.entry && item.entry.horse_no || '');
        if (horseNo && !ranks.has(horseNo)) ranks.set(horseNo, rankIndex + 1);
      });
    }
    return { weight: A5.MODEL_WEIGHTS[index] || 0, ranks };
  }).filter(model => model.weight > 0 && model.ranks.size > 1);
  const totalWeight = models.reduce((sum, model) => sum + model.weight, 0);
  if (!totalWeight) return [];

  const scored = entries.map(entry => {
    const horseNo = String(entry.horse_no || '');
    let score = 0;
    let weightedRank = 0;
    let topFourCount = 0;
    let topPickCount = 0;
    let bestRank = entries.length + 1;
    for (const model of models) {
      const rank = model.ranks.get(horseNo) || entries.length + 1;
      score += model.weight / (rank + 3);
      weightedRank += model.weight * rank;
      if (rank <= 4) topFourCount += 1;
      if (rank === 1) topPickCount += 1;
      bestRank = Math.min(bestRank, rank);
    }
    score /= totalWeight;
    weightedRank /= totalWeight;
    const support = topFourCount === models.length ? `${modelCountText5(models.length)}模共識`
      : topFourCount >= 3 ? `${modelCountText5(topFourCount)}模支持`
      : topFourCount === 2 ? '雙模支持'
      : topFourCount === 1 ? '單模入圍'
      : '互補排名';
    const secondReason = topPickCount >= 2
      ? `${topPickCount}模首選`
      : `加權榜位 ${weightedRank.toFixed(1)}`;
    return {
      entry,
      horse: stripCode(entry.horse_name),
      score,
      weightedRank,
      topFourCount,
      topPickCount,
      modelCount: models.length,
      bestRank,
      reasons: [support, secondReason],
    };
  });

  const meanScore = scored.reduce((sum, item) => sum + item.score, 0) / scored.length;
  const probabilities = plProbs4(
    scored.map(item => (item.score - meanScore) * A5.SCORE_SCALE),
    A5.TEMP
  );
  scored.forEach((item, index) => {
    item.prob = probabilities.win[index];
    item.placeProb = Math.max(0, Math.min(1, probabilities.place[index]));
  });
  scored.sort((a, b) => b.prob - a.prob || Number(a.entry.horse_no) - Number(b.entry.horse_no));

  const top = scored[0];
  const topSupport = top.topFourCount === top.modelCount ? `${modelCountText5(top.modelCount)}模共識`
    : `${top.topFourCount}/${top.modelCount} 模型前四支持`;
  const topName = String(top.horse || '').replace(/[<>&]/g, '');
  const weightText = A5.MODEL_WEIGHTS.map(weight => `${Math.round(weight * 100)}%`).join(' / ');
  scored.insight = `四模型反向榜位融合（${weightText}）· ${topSupport} · 首選 ${top.entry.horse_no} ${topName}（勝率 ${(top.prob * 100).toFixed(1)}% · 入位 ${(top.placeProb * 100).toFixed(0)}%）`;
  return scored;
}

/* ════════════ 預測算法6：Deepseek Flash4.1 萃衡 ════════════
   薈萃五模、權衡輕重。以五個模型輸出的「場內標準化值」為特徵，
   用條件 Plackett-Luce 對數似然做梯度訓練（688 場走步回測、L2 正則），
   學出各模型在不同場面的相對可信度，再以學得權重輸出勝出與入位機率。
   權重為離線學習結果；特徵計算方式與訓練時完全一致。 */
const A6 = {
  COEF: [0.1572, 0.0449, 0.0236, 0.2018, -0.0088],
  TEMP: 0.75,
  LABELS: ['加權評分', '貝氏機率', '精算速度', '玄機對弈', '月衡融合'],
};

function zScores6(values) {
  const valid = values.filter(value => Number.isFinite(value));
  const mean = valid.length ? valid.reduce((sum, value) => sum + value, 0) / valid.length : 0;
  const variance = valid.length ? valid.reduce((sum, value) => sum + (value - mean) ** 2, 0) / valid.length : 0;
  const sd = Math.sqrt(variance);
  return { mean, sd: sd > 1e-6 ? sd : 0 };
}

function modelValue6(prediction, entry) {
  if (!Array.isArray(prediction)) return NaN;
  const item = prediction.find(row => String(row.entry && row.entry.horse_no || '') === String(entry.horse_no));
  if (!item) return NaN;
  return Number.isFinite(item.prob) ? item.prob : (Number.isFinite(item.score) ? item.score : NaN);
}

function buildPrediction6(entries, modelPredictions) {
  if (!entries || entries.length < 2 || !Array.isArray(modelPredictions)) return [];
  const columns = A6.COEF.length;
  const raw = entries.map(entry => modelPredictions.slice(0, columns).map(prediction => modelValue6(prediction, entry)));
  const stats = [];
  for (let column = 0; column < columns; column++) {
    stats.push(zScores6(raw.map(row => row[column])));
  }
  const scored = entries.map((entry, index) => {
    const z = raw[index].map((value, column) => {
      const { mean, sd } = stats[column];
      return sd > 0 && Number.isFinite(value) ? (value - mean) / sd : 0;
    });
    const contributions = z.map((value, column) => value * A6.COEF[column]);
    const score = contributions.reduce((sum, value) => sum + value, 0);
    const ranked = contributions.map((value, column) => ({ value, column })).sort((a, b) => b.value - a.value);
    const reasons = ranked.filter(row => row.value >= 0.05).slice(0, 2).map(row => `${A6.LABELS[row.column]}支持`);
    if (!reasons.length) reasons.push('五模型綜合均衡');
    return { entry, horse: stripCode(entry.horse_name), score, contributions, reasons };
  });
  const probs = plProbs4(scored.map(item => item.score), A6.TEMP);
  scored.forEach((item, index) => {
    item.prob = probs.win[index];
    item.placeProb = Math.max(0, Math.min(1, probs.place[index]));
  });
  scored.sort((a, b) => b.prob - a.prob || Number(a.entry.horse_no) - Number(b.entry.horse_no));
  const top = scored[0];
  const topName = String(top.horse || '').replace(/[<>&]/g, '');
  const lead = top.contributions
    .map((value, column) => ({ value, column }))
    .sort((a, b) => b.value - a.value)[0];
  scored.insight = `五模型梯度集成（萃衡權重）· 主要訊號：${lead ? A6.LABELS[lead.column] : '—'} · 首選 ${top.entry.horse_no} ${topName}（勝率 ${(top.prob * 100).toFixed(1)}% · 入位 ${(top.placeProb * 100).toFixed(0)}%）`;
  return scored;
}

/* ════════════ 預測算法7：GLM 5.3 Flash 格物致知 ════════════
   格物：不借用任何預測模型的輸出，直接由原始賽果推導每駒 22 項特徵
   （對手調整實力、同程邊際、近仗、趨勢、穩定度、負磅、檔位、騎練、
   步速、對頭馬、場地、級數等）；致知：以條件 Plackett-Luce 對數似然
   配 L2 正則，在走步回測上離線梯度學習權重，再以校準溫度輸出
   勝出與入位機率。特徵計算與訓練時完全一致。 */
const A7 = {
  BETA: [0.1395, 0.0488, 0.1004, 0.1648, 0.0942, 0.0445, 0.0213, -0.0199, 0.0017, 0.014, 0.204, 0.1873, 0.0476, 0.0058, 0.0656, -0.0258, 0.0758, 0.1523, 0.0164, -0.0531, 0.0618, 0.0534],
  TEMP: 0.6,
  LABELS: [
    '實力評分', '場內評分', '同程優勢', '近仗入位', '上仗走位', '狀態趨勢',
    '發揮波動', '復出週期', '上仗受阻', '負磅輕盈', '檔位有利', '騎師質素',
    '練馬師質素', '人馬合拍', '換騎升級', '騎師手熱', '練馬師熱', '對頭馬佔優',
    '步速對路', '場地合拍', '對手轉弱', '內檔短途',
  ],
};

function buildFeatures7(entries, race) {
  if (!IDX4 || !entries || entries.length < 2) return null;
  const asOfDate = String((race && race.date) || (RACECARD && RACECARD.date) || '');
  const asOfEpoch = dateEpoch2(asOfDate);
  const epochCut = Number.isFinite(asOfEpoch) ? asOfEpoch : Infinity;
  const distance = String((race && race.distance) || '');
  const distM = parseInt(distance, 10) || 1200;
  const goingCat = goingCategory2(race && race.going);
  const venue = String((race && race.venue) || (RACECARD && RACECARD.venue) || inferVenue4(distM) || '').toUpperCase();
  const distFactor = Math.max(0.85, Math.min(1.75, distM / 1400));
  const rivals = new Set(entries.map(entry => stripCode(entry.horse_name)).filter(Boolean));

  const carriedOf = entry => {
    const rider = parseRider4(entry.jockey);
    const allocated = parseFloat(entry.weight);
    return { rider, carried: Number.isFinite(allocated) ? allocated - rider.claim : NaN };
  };
  const carriedWeights = entries.map(entry => carriedOf(entry).carried).filter(weight => Number.isFinite(weight) && weight > 0);
  const fieldMed = carriedWeights.length ? median2(carriedWeights) : 0;
  const riderCache = new Map();
  const trainerCache = new Map();
  const cachedRider = name => {
    if (!name) return { score: 0, n: 0 };
    if (riderCache.has(name)) return riderCache.get(name);
    const score = riderScore4(IDX4.byJockey.get(name), epochCut, IDX4.p0Win, IDX4.p0Place, A4.K_JOCKEY);
    riderCache.set(name, score);
    return score;
  };
  const cachedTrainer = name => {
    if (!name) return { score: 0, n: 0 };
    if (trainerCache.has(name)) return trainerCache.get(name);
    const score = riderScore4(IDX4.byTrainer.get(name), epochCut, IDX4.p0Win, IDX4.p0Place, A4.K_TRAINER);
    trainerCache.set(name, score);
    return score;
  };

  const ctx = entries.map(entry => {
    const horse = stripCode(entry.horse_name);
    const rider = parseRider4(entry.jockey);
    const trainer = String(entry.trainer || '').trim();
    const gate = parseInt(entry.gate, 10) || 0;
    const carried = carriedOf(entry).carried;
    const history = (IDX4.byHorse.get(horse) || []).filter(run => run.epoch < epochCut);
    const margin = decayedMean4(history, epochCut, run => run.pr, run => run.weakRace ? 0.45 : 1);
    const speed = decayedMean4(history, epochCut, run => run.speed, run => run.weakRace ? 0.45 : 1);
    const z = margin.nEff / (margin.nEff + A4.K_HORSE);
    const speedMean = speed.nEff >= 0.8 ? speed.mean : margin.mean;
    const blended = (1 - A4.SPEED_BLEND) * margin.mean + A4.SPEED_BLEND * speedMean;
    const ability = z * blended;
    const exact = history.filter(run => run.dist === distance);
    const near = exact.length >= 2 ? exact : history.filter(run => Math.abs(run.distM - distM) <= 200);
    const distStats = decayedMean4(near, epochCut, run => run.pr, run => (run.weakRace ? 0.45 : 1) * (run.dist === distance ? 1 : 0.62));
    const zD = distStats.nEff / (distStats.nEff + 2.2);
    const distEdge = clamp4(zD * (distStats.mean - margin.mean), -1.4, 1.4);

    let styleW = 0;
    let styleSum = 0;
    let styleN = 0;
    for (const run of history) {
      if (run.style === null) continue;
      const days = Math.max(0, (epochCut - run.epoch) / 86400000);
      const w = Math.exp(-days / 160);
      styleW += w;
      styleSum += run.style * w;
      styleN += 1;
    }
    const style = styleW ? styleSum / styleW : null;
    const last = history.length ? history[history.length - 1] : null;
    const daysSince = last ? Math.max(0, (epochCut - last.epoch) / 86400000) : NaN;
    const bounce = last && last.trip >= 0.85 && last.rank >= 4 && last.rank <= 11 && daysSince <= 75
      ? Math.min(0.8, last.trip * A4.W_BOUNCE) : 0;
    let trend = 0;
    if (history.length >= 3) {
      trend = clamp4((history[history.length - 1].pr - history[history.length - 3].pr) * 0.08, -0.3, 0.32);
    }
    const lastEdge = last ? clamp4((last.pr - blended) * A4.W_LAST, -0.28, 0.32) : 0;
    let formW = 0;
    let formSum = 0;
    for (const run of history.slice(-6)) {
      if (!run.finished) continue;
      const days = Math.max(0, (epochCut - run.epoch) / 86400000);
      const w = Math.exp(-days / A4.HALF_LIFE) * (run.dist === distance ? 1.28 : 1);
      const pt = run.rank === 1 ? 1 : run.rank <= 3 ? 0.66 : run.rank <= 5 ? 0.3 : run.rank <= 7 ? 0.08 : 0;
      formW += w;
      formSum += pt * w;
    }
    const formPts = formW ? formSum / formW : 0.3;
    let volPen = 0;
    if (history.length >= 4) {
      const recent = history.slice(-8);
      const mean = recent.reduce((sum, run) => sum + run.pr, 0) / recent.length;
      const variance = recent.reduce((sum, run) => sum + (run.pr - mean) ** 2, 0) / recent.length;
      volPen = Math.min(0.45, Math.sqrt(variance) * 0.045);
    }
    let goingAdj = 0;
    if (goingCat && goingCat !== '其他') {
      const goingRuns = history.filter(run => run.goingCat === goingCat);
      if (goingRuns.length >= 2) {
        const gMean = goingRuns.reduce((sum, run) => sum + run.pr, 0) / goingRuns.length;
        goingAdj = clamp4((gMean - margin.mean) * 0.3, -0.35, 0.35);
      }
    }
    let h2h = 0;
    for (let i = Math.max(0, history.length - 10); i < history.length; i++) {
      const run = history[i];
      const field = IDX4.roster.get(run.raceKey);
      if (!field) continue;
      const daysAgo = Math.max(0, (epochCut - run.epoch) / 86400000);
      if (daysAgo > 420) continue;
      for (const other of field) {
        if (other.horse === horse || !rivals.has(other.horse)) continue;
        const beat = run.rank < other.rank ? 1 : run.rank > other.rank ? 0 : 0.5;
        h2h += (beat - 0.5) * 0.5 * Math.exp(-daysAgo / 200) * (run.dist === distance ? 1 : 0.7);
      }
    }
    h2h = clamp4(h2h, -0.75, 0.75);
    const sameRider = history.filter(run => run.jockey && run.jockey === rider.name);
    let combo = 0;
    if (sameRider.length) {
      const comboWins = sameRider.filter(run => run.win).length;
      if (comboWins >= 1) combo = 0.26 + Math.min(0.22, (comboWins - 1) * 0.07);
      else if (sameRider.length >= 4) combo = -0.16;
    }
    const jockeyNow = cachedRider(rider.name);
    const trainerNow = cachedTrainer(trainer);
    const seen = new Set();
    const usualScores = [];
    for (let i = history.length - 1; i >= 0 && usualScores.length < 4; i--) {
      const name = history[i].jockey;
      if (!name || seen.has(name)) continue;
      seen.add(name);
      usualScores.push(cachedRider(name).score);
    }
    const usual = usualScores.length ? usualScores.reduce((sum, value) => sum + value, 0) / usualScores.length : 0;
    const upgrade = history.length ? jockeyNow.score - usual : 0;
    const jHot = clamp4(hotEdge4(IDX4.byJockey.get(rider.name), epochCut, 60, 12) * 4.5, -0.4, 0.42);
    const tHot = clamp4(hotEdge4(IDX4.byTrainer.get(trainer), epochCut, 45, 8) * 4.2, -0.35, 0.38);
    const weightAdj = fieldMed > 0 && Number.isFinite(carried) ? (fieldMed - carried) * A4.LB_PER_LB * distFactor : 0;
    const bucket = gate >= 1 ? IDX4.draw.get(distBand4(distM) + '|' + gateBucket4(gate)) : null;
    const zDraw = bucket ? bucket.n / (bucket.n + A4.DRAW_K) : 0;
    const drawAdj = clamp4((zDraw * (bucket ? bucket.effect : 0)) * 0.85 + venueDrawPrior4(venue, distM, gate) * 0.62, -0.7, 0.6);

    return {
      entry, horse, rider, trainer, gate, ability, blended, distEdge, formPts,
      lastEdge, trend, volPen, daysSince, bounce, weightAdj, drawAdj,
      jockeyScore: jockeyNow.score, trainerScore: trainerNow.score,
      combo, upgrade, jHot, tHot, h2h, goingAdj, style, styleN,
      nEff: margin.nEff, last,
    };
  });

  const knownRaw = ctx.filter(item => item.nEff >= 1.2);
  const todayClass = knownRaw.length
    ? knownRaw.reduce((sum, item) => sum + item.blended, 0) / knownRaw.length : 0;
  const knownStyle = ctx.filter(item => item.styleN >= 2 && item.style !== null).length;
  const paceOn = knownStyle >= Math.min(4, Math.ceil(ctx.length * 0.35));
  const frontCount = paceOn ? ctx.filter(item => item.styleN >= 2 && item.style >= 0.5).length : 0;
  const neutralPace = distM >= 1800 ? 1.6 : distM >= 1400 ? 2 : 2.3;

  return ctx.map(item => {
    const styleConf = item.style === null ? 0 : Math.min(1, item.styleN / 4);
    let paceAdj = 0;
    if (paceOn && styleConf > 0) {
      paceAdj = styleConf * (frontCount - neutralPace) * (-0.3 * item.style);
      if (distM <= 1200 && item.gate >= 11 && item.style > 0.4) paceAdj -= 0.32 * styleConf;
      if (distM <= 1200 && item.gate <= 3 && item.style > 0.4) paceAdj += 0.18 * styleConf;
      if (distM >= 1600 && item.style < -0.4 && frontCount >= 3) paceAdj += 0.12 * styleConf;
      paceAdj = clamp4(paceAdj, -0.8, 0.8) * A4.W_PACE;
    }
    const classAdj = item.last && !item.last.weakRace && item.daysSince <= 120 && item.nEff >= 1.4
      ? clamp4((item.last.fieldAbility - todayClass) * A4.W_CLASS, -1, 1) : 0;
    const gateSprint = distM <= 1400 && item.gate >= 1 && item.gate <= 4 ? 1 : 0;
    return [
      item.ability, item.blended, item.distEdge, item.formPts, item.lastEdge, item.trend,
      item.volPen, Number.isFinite(item.daysSince) ? Math.log1p(Math.min(400, item.daysSince)) : Math.log1p(400),
      item.bounce, item.weightAdj, item.drawAdj, item.jockeyScore, item.trainerScore,
      item.combo, item.upgrade, item.jHot, item.tHot, item.h2h, paceAdj, item.goingAdj,
      classAdj, gateSprint,
    ];
  });
}

function buildPrediction7(entries, race) {
  const features = buildFeatures7(entries, race);
  if (!features) return [];
  const dim = A7.BETA.length;
  const scored = features.map((row, index) => {
    const contributions = row.map((value, c) => (Number.isFinite(value) ? value : 0) * A7.BETA[c]);
    const score = contributions.reduce((sum, value) => sum + value, 0);
    const ranked = contributions.map((value, c) => ({ value, c })).sort((a, b) => b.value - a.value);
    const reasons = ranked.filter(row => row.value >= 0.08).slice(0, 2).map(row => A7.LABELS[row.c]);
    if (!reasons.length) reasons.push('綜合格物均衡');
    return { entry: entries[index], horse: stripCode(entries[index].horse_name), score, contributions, reasons };
  });
  const probs = plProbs4(scored.map(item => item.score), A7.TEMP);
  scored.forEach((item, index) => {
    item.prob = probs.win[index];
    item.placeProb = Math.max(0, Math.min(1, probs.place[index]));
  });
  scored.sort((a, b) => b.prob - a.prob || Number(a.entry.horse_no) - Number(b.entry.horse_no));
  const top = scored[0];
  const topName = String(top.horse || '').replace(/[<>&]/g, '');
  const lead = top.contributions.map((value, c) => ({ value, c })).sort((a, b) => b.value - a.value)[0];
  scored.insight = `格物致知 · 22維特徵學得權重 · 主要訊號：${lead ? A7.LABELS[lead.c] : '—'} · 首選 ${top.entry.horse_no} ${topName}（勝率 ${(top.prob * 100).toFixed(1)}% · 入位 ${(top.placeProb * 100).toFixed(0)}%）`;
  return scored;
}

/* ── Render race strip (mobile) ─────────────────── */
function renderRaceStrip() {
  if (!$raceStrip || !RACECARD || !RACECARD.races) return;

  RACECARD.races.forEach(race => {
    const div = document.createElement('div');
    div.className = 'race-bubble' + (race.race_no === activeRace ? ' active' : '');

        <span>走位（前 → 後）</span>
        <span>同程成績</span>
      </div>
    </div>
    ${cards}
    <div style="height:16px"></div>`;
}

/* ── Select a race ───────────────────────────────── */
function selectRace(raceNo) {
  activeRace = raceNo;
  renderRaceList();
  renderDetail();
  if (window.innerWidth <= 679) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

/* ── UI state helpers ────────────────────────────── */
function showLoading(on) {
  $overlay.classList.toggle('hidden', !on);
}
function showFullstate(icon, title, msg, showRetry) {
  document.getElementById('fullstateIcon').textContent  = icon;
  document.getElementById('fullstateTitle').textContent = title;
  document.getElementById('fullstateMsg').textContent   = msg;
  $retryBtn.classList.toggle('hidden', !showRetry);
  $fullstate.classList.remove('hidden');
  $mainLayout.classList.add('hidden');
  $raceStrip.classList.add('hidden');
}

/* ── Data loading ─────────────────────────────────── */
async function loadData() {
  showLoading(true);
  $fullstate.classList.add('hidden');
  $mainLayout.classList.add('hidden');

  try {
    const demoMode = new URLSearchParams(window.location.search).get('demo') === 'previous';
    const localHistory = demoMode && ['localhost', '127.0.0.1'].includes(window.location.hostname);
    const historyUrl = localHistory
      ? '../hkjc_scraper/data/all_results.csv'
      : `${SCRAPER_RAW}/data/all_results.csv`;
    const [racecard, csvText] = await Promise.all([
      demoMode ? Promise.resolve(null) : fetch(`${SCRAPER_RAW}/data/racecard_today.json`).then(r => {
        if (!r.ok) throw new Error(`racecard_today.json 下載失敗 (${r.status})`);
        return r.json();
      }),
      fetch(historyUrl).then(r => {
        if (!r.ok) throw new Error(`all_results.csv 下載失敗 (${r.status})`);
        return r.text();
      }),
    ]);

    D        = parseCSV(csvText);
    if (demoMode) {
      const demo = buildPreviousRaceDemo(D);
      D = demo.history;
      RACECARD = demo.racecard;
    } else {
      RACECARD = normalizeRacecardData(racecard);
    }
    try {
      buildIndexes2();
    } catch (e) {
      console.warn('算法2索引建立失敗，算法1不受影響', e);
      IDX2 = null;
    }
    try {
      buildIndexes3();
    } catch (e) {
      console.warn('算法3索引建立失敗，其他算法不受影響', e);
      IDX3 = null;
    }
    try {
      buildIndexes4();
    } catch (e) {
      console.warn('算法4索引建立失敗，其他算法不受影響', e);
      IDX4 = null;
    }

    if (!RACECARD.races || !RACECARD.races.length) {
      showFullstate('📅', '暫未有可用本地賽事卡', '如馬會已發佈下一賽日資料，請稍後重試。', false);
      $hdrDate.textContent = '無賽事';
      return;
    }

    // Init UI
    const dateStr = RACECARD.date || '—';
    $hdrDate.textContent  = dateStr + ' 賽事';
    $panelDate.textContent = dateStr;

    activeRace = RACECARD.races[0].race_no;
    $mainLayout.classList.remove('hidden');
    $raceStrip.classList.remove('hidden');
    renderRaceList();
    renderDetail();

  } catch (e) {
    console.error(e);
    showFullstate('⚠️', '資料載入失敗', e.message, true);
    $hdrDate.textContent = '載入失敗';
  } finally {
    showLoading(false);
  }
}

/* ── Bootstrap ───────────────────────────────────── */
loadData();
</script>
</body>
</html>
